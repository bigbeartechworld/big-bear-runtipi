# Configuration for 2fauth setup

# Application Name
# Services used in the application
services:
  2fauth:
    # Name of the container
    container_name: 2fauth
    # Docker image to be used
    image: 2fauth/2fauth:8.0.3@sha256:abf35f1eef5963638737ad5daeea4918280541f7b6ab97a21fae3632cb7efecd
    # Restart policy for the service
    restart: unless-stopped
    # Volumes for the service HOST -> CONTAINER
    volumes:
      - ${APP_DATA_DIR}/data:/2fauth
    # Environment variables for the service
    environment:
      - APP_URL=http://[CHANGE_TO_LAN_IP]:8000
    x-runtipi:
      is_main: true
      internal_port: 8000
x-runtipi:
  schema_version: 2
