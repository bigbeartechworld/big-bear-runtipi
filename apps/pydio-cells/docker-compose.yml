services:
  pydio-cells:
    image: linuxserver/pydio-cells:5.1.0@sha256:18f9195420c0aa1b9e1c3c47e2307078e85aa6b99e3d544f1d9abe32d168f891
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      EXTERNALURL: ''
      SERVER_IP: ''
    volumes:
      - type: bind
        source: /DATA/AppData/pydio-cells/config
        target: /config
    container_name: pydio-cells
    x-runtipi:
      is_main: true
      internal_port: 8080
x-runtipi:
  schema_version: 2
