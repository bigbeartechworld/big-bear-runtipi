services:
  pydio-cells:
    image: linuxserver/pydio-cells:5.1.0@sha256:4aeebe9a3d29ac1a6eb8799809a81d320b26d0381bddd5d3ebdec107d9485b9c
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      EXTERNALURL: ''
      SERVER_IP: ''
    volumes:
      - type: bind
        source: /DATA/AppData/pydio-cells/config
        target: /config
    container_name: pydio-cells
    x-runtipi:
      is_main: true
      internal_port: 8080
x-runtipi:
  schema_version: 2
