services:
  pydio-cells:
    image: linuxserver/pydio-cells:5.1.0@sha256:39dd5302e3a20d55149741c724fc01953e59e876d6cada079867aac0719182f4
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      EXTERNALURL: ''
      SERVER_IP: ''
    volumes:
      - type: bind
        source: /DATA/AppData/pydio-cells/config
        target: /config
    container_name: pydio-cells
    x-runtipi:
      is_main: true
      internal_port: 8080
x-runtipi:
  schema_version: 2
