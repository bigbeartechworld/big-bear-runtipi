services:
  openssh-server:
    image: linuxserver/openssh-server:version-10.3_p1-r1@sha256:b07414bb329b86a00525c9256711a7855fc3a369e9f62c36f1de8d1923197580
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      PUBLIC_KEY: ''
      PUBLIC_KEY_FILE: ''
      PUBLIC_KEY_DIR: ''
      PUBLIC_KEY_URL: ''
      SUDO_ACCESS: ''
      PASSWORD_ACCESS: ''
      USER_PASSWORD: ''
      USER_PASSWORD_FILE: ''
      USER_NAME: ''
      LOG_STDOUT: ''
    volumes:
      - type: bind
        source: /DATA/AppData/openssh-server/config
        target: /config
    container_name: openssh-server
    x-runtipi:
      is_main: true
      internal_port: 2222
x-runtipi:
  schema_version: 2
