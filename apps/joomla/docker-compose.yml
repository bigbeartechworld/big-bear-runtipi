services:
  joomladb:
    image: mysql:9.7.2
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 15311349-803b-40a2-9153-5b13f8d4022e
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/mysql
        target: /var/lib/mysql
  joomla:
    image: joomla:6.1.4-apache
    environment:
      JOOMLA_DB_HOST: joomladb
      JOOMLA_DB_PASSWORD: 15311349-803b-40a2-9153-5b13f8d4022e
    depends_on:
      - joomladb
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/www
        target: /var/www/html
    container_name: joomla
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
