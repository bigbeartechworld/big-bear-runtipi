services:
  librewolf:
    image: linuxserver/librewolf:157.0.1@sha256:489a151de407f01f0e5086166da313872aeec67e78ad096d793641531a061511
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      LIBREWOLF_CLI: ''
    volumes:
      - type: bind
        source: /DATA/AppData/librewolf/config
        target: /config
    container_name: librewolf
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
