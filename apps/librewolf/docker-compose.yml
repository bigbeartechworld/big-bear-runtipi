services:
  librewolf:
    image: linuxserver/librewolf:158.0.1@sha256:209570e3839036c2d4d15558eac626f1f7ce521cc0141b6dba67f35d051e3210
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      LIBREWOLF_CLI: ''
    volumes:
      - type: bind
        source: /DATA/AppData/librewolf/config
        target: /config
    container_name: librewolf
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
