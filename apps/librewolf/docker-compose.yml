services:
  librewolf:
    image: linuxserver/librewolf:158.0.1@sha256:78298efcbb552eb51e537758088f28c47c065f7fb2877fc0248b1e291937603c
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      LIBREWOLF_CLI: ''
    volumes:
      - type: bind
        source: /DATA/AppData/librewolf/config
        target: /config
    container_name: librewolf
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
