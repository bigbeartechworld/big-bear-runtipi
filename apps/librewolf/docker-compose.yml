services:
  librewolf:
    image: linuxserver/librewolf:158.0.1@sha256:9503a95a4216b96b44483a458910de9b65708ae92bbeef0205f4d88ee1a9cdce
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      LIBREWOLF_CLI: ''
    volumes:
      - type: bind
        source: /DATA/AppData/librewolf/config
        target: /config
    container_name: librewolf
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
