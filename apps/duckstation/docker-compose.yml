services:
  duckstation:
    image: linuxserver/duckstation:version-latest@sha256:c8ac72a408a78852ff60ac314e450a485271a022f50ffbe737c02bacb3622c86
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/duckstation/config
        target: /config
    container_name: duckstation
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
