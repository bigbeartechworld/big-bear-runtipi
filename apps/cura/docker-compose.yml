services:
  cura:
    image: linuxserver/cura:5.13.0@sha256:b864b5b0448dbe2a2649c6f76de81496c59e86a21e6f2650ea706af649d8d9ec
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/cura/config
        target: /config
    container_name: cura
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
