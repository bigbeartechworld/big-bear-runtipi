services:
  cura:
    image: linuxserver/cura:5.13.0@sha256:4b7f512f5e2f5460cc5897d5032640bb43c434220343e7089bc84cf8b7642311
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/cura/config
        target: /config
    container_name: cura
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
