services:
  minecraft:
    image: itzg/minecraft-server:2026.10.1
    environment:
      EULA: true
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /data
    container_name: minecraft
    x-runtipi:
      is_main: true
      internal_port: 25565
x-runtipi:
  schema_version: 2
