services:
  minecraft:
    image: itzg/minecraft-server:2026.9.1
    environment:
      EULA: true
    ports:
      - target: 25565
        published: ${APP_PORT}
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /data
    container_name: minecraft
    labels:
      runtipi.managed: "true"
    networks:
      - tipi_main_network
networks:
  tipi_main_network:
    external: true
