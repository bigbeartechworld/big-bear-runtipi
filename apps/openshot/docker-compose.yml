services:
  openshot:
    image: linuxserver/openshot:4.0.1@sha256:5332b8911c60341a8db307dedfe7ab8b46cdf4dd17166c9f233693fc123c8ab7
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/openshot/config
        target: /config
    container_name: openshot
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
