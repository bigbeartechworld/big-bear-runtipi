services:
  openshot:
    image: linuxserver/openshot:4.0.1@sha256:35535fba64adfeeb2f9ccc5d2c37e296dc812f87e0c8cc3cb8346fccb3d2bf50
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/openshot/config
        target: /config
    container_name: openshot
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
