services:
  openshot:
    image: linuxserver/openshot:4.0.1@sha256:b26dec3801aec4350babeb7ae44496ceebcc3060aae1c32bbd96919a99946ee9
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/openshot/config
        target: /config
    container_name: openshot
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
