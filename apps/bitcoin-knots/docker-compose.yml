services:
  bitcoin-knots:
    image: linuxserver/bitcoin-knots:version-29.4.knots20260508.1-noble1@sha256:c5f17ac3492af411bf83e2a62c1640be1b53b551570d3d39876c1b18bec82879
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: ${APP_PORT}
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
      - target: 8333
        published: 8333
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/bitcoin-knots/config
        target: /config
    container_name: bitcoin-knots
    labels:
      runtipi.managed: "true"
    networks:
      - tipi_main_network
networks:
  tipi_main_network:
    external: true
