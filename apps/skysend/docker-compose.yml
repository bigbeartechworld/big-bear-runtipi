services:
  skysend:
    image: skyfay/skysend:v3.0.1@sha256:aa38fb1213fb564037b728c6a8a5d619a3223dfd3006509b79058384fe76d6fa
    container_name: skysend
    restart: unless-stopped
    ports:
      - "${APP_PORT}:3000"
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ${APP_DATA_DIR}/data/uploads:/uploads
    environment:
      BASE_URL: http://localhost:23001
      DATA_DIR: /data
      UPLOADS_DIR: /uploads
    labels:
      runtipi.managed: "true"
    networks:
      - tipi_main_network
networks:
  tipi_main_network:
    external: true
