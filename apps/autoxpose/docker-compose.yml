services:
  autoxpose:
    image: mostafawahied/autoxpose:0.6.0@sha256:8b07a7c693c4270bb04adf4e68c16681de1336384ce70e86a507ab02ffeb09cd
    container_name: autoxpose
    restart: unless-stopped
    environment:
      SERVER_IP: ""
      LAN_IP: ""
    volumes:
      - ${APP_DATA_DIR}/data:/app/packages/backend/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
