services:
  autoxpose:
    image: mostafawahied/autoxpose:0.5.2@sha256:5e29bc48b7b164127f1ade8f3d9be9dba06e665ed2cdeeb569173fa343eca5d3
    container_name: autoxpose
    restart: unless-stopped
    ports:
      - "${APP_PORT}:3000"
    environment:
      SERVER_IP: ""
      LAN_IP: ""
    volumes:
      - ${APP_DATA_DIR}/data:/app/packages/backend/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      runtipi.managed: "true"
    networks:
      - tipi_main_network
networks:
  tipi_main_network:
    external: true
