services:
  winegui:
    image: linuxserver/winegui:4.5.1@sha256:11b54e3c42d7b9cef20f22ba7cea4dc9767edca36794515ba766c5395bef8e2d
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/winegui/config
        target: /config
    container_name: winegui
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
