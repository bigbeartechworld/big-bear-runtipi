services:
  winegui:
    image: linuxserver/winegui:4.5.1@sha256:41a12b6613072df63bae0d05331386a84c8a347095f4b99b4f20a9bb72b8517f
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/winegui/config
        target: /config
    container_name: winegui
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
