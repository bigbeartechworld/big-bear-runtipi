services:
  winegui:
    image: linuxserver/winegui:4.5.1@sha256:e5fa5df6f9e566c7be2548ea9e547bcc5a41dc97fe7d31cdee6de107935a7ce8
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/winegui/config
        target: /config
    container_name: winegui
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
