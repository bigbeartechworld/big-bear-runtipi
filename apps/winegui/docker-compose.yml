services:
  winegui:
    image: linuxserver/winegui:4.5.1@sha256:59ec652acc8f5d4aab7308ee7d3d30bd68858d11264d9e54e0d526584232421a
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/winegui/config
        target: /config
    container_name: winegui
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
