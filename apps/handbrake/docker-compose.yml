services:
  handbrake:
    image: linuxserver/handbrake:1.11.2@sha256:336dada61d7b69abc183443e7ab65d412c78ca14af907f2fb1ab9cf3b6b01940
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/handbrake/config
        target: /config
    container_name: handbrake
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
