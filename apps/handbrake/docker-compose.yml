services:
  handbrake:
    image: linuxserver/handbrake:1.11.2@sha256:fdd6ce95ac014efbd64920af2428fae49343f6332ea75e28316eb2b7a69f8069
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: ${APP_PORT}
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/handbrake/config
        target: /config
    container_name: handbrake
    labels:
      runtipi.managed: "true"
    networks:
      - tipi_main_network
networks:
  tipi_main_network:
    external: true
