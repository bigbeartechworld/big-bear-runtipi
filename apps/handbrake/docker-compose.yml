services:
  handbrake:
    image: linuxserver/handbrake:1.11.2@sha256:58c17f7f8b37d6cdb11ac269d927c953f0fb13cbc918372bceaa597a33d5e221
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/handbrake/config
        target: /config
    container_name: handbrake
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
