services:
  handbrake:
    image: linuxserver/handbrake:1.11.2@sha256:a80a03a272e76b8deeec071e5b0a3c582708da5603eee354ca2cb1e72b9e01b2
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/handbrake/config
        target: /config
    container_name: handbrake
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
