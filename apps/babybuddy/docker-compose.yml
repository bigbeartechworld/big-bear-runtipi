services:
  babybuddy:
    image: linuxserver/babybuddy:2.11.0@sha256:3f244c1a3cd06696c2e8edb40f9fda71a837a77fee06f2f5c2f96ac99c135071
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      CSRF_TRUSTED_ORIGINS: ''
    volumes:
      - type: bind
        source: /DATA/AppData/babybuddy/config
        target: /config
    container_name: babybuddy
    x-runtipi:
      is_main: true
      internal_port: 8000
x-runtipi:
  schema_version: 2
