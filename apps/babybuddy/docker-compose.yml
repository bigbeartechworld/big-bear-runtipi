services:
  babybuddy:
    image: linuxserver/babybuddy:2.11.0@sha256:69235a527e02788aeb367b2bd9bac33365690cf18e2183330999225bb0a7f97b
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      CSRF_TRUSTED_ORIGINS: ''
    volumes:
      - type: bind
        source: /DATA/AppData/babybuddy/config
        target: /config
    container_name: babybuddy
    x-runtipi:
      is_main: true
      internal_port: 8000
x-runtipi:
  schema_version: 2
