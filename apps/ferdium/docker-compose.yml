services:
  ferdium:
    image: linuxserver/ferdium:7.2.3@sha256:ee706fb59ad2855c8b5d33aa8a07bb8079c39a8493a95cc88caaf733b8e01aa5
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/ferdium/config
        target: /config
    container_name: ferdium
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
