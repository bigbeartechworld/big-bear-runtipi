services:
  pcsx2:
    image: linuxserver/pcsx2:2.8.2@sha256:a5fc828ea0b51297a144e4ef4b7752641f1857df57024368b363a0ba01ae0f51
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/pcsx2/config
        target: /config
    container_name: pcsx2
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
