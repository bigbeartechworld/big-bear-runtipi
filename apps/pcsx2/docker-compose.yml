services:
  pcsx2:
    image: linuxserver/pcsx2:2.8.2@sha256:cf33a35769e299772ec213b595c3113cc10416ad67da10ef9f2275c32a3bd83d
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/pcsx2/config
        target: /config
    container_name: pcsx2
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
