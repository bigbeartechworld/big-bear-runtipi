services:
  pcsx2:
    image: linuxserver/pcsx2:2.8.2@sha256:fe2bb6d7bbec92eb0c4ed0bda816d07f5ed8ce184127c0584338a2778038eb62
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/pcsx2/config
        target: /config
    container_name: pcsx2
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
