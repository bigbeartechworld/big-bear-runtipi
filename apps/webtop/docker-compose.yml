services:
  webtop:
    image: linuxserver/webtop:arch-kde-version-2025-07-12@sha256:21db23d80427859457e1abada23ed51b1d876c70bfb173ad602150e0b6deec94
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/webtop/config
        target: /config
    container_name: webtop
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
