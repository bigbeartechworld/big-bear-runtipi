services:
  webtop:
    image: linuxserver/webtop:arch-kde-version-2025-07-12@sha256:cdd4f999430db4b04778723cd8cf4ed63c57beeea678a9aeae42a15a6901940a
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/webtop/config
        target: /config
    container_name: webtop
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
