services:
  redis:
    image: redis:8.8.3
    restart: unless-stopped
    volumes:
      - type: bind
        source: /DATA/AppData/redis/data
        target: /data
      - type: bind
        source: /DATA/AppData/redis/config
        target: /usr/local/etc/redis
    container_name: redis
    x-runtipi:
      is_main: true
      internal_port: 6379
x-runtipi:
  schema_version: 2
