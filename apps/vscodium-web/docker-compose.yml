services:
  vscodium-web:
    image: linuxserver/vscodium-web:1.140.06880@sha256:e263889f8c040ac221144dd19e7ae9469e1b6f20c25acdca5694ef7eb6a9f514
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      CONNECTION_TOKEN: ''
      CONNECTION_TOKEN_FILE: ''
      SUDO_PASSWORD: ''
      SUDO_PASSWORD_HASH: ''
      CODE_ARGS: ''
    volumes:
      - type: bind
        source: /DATA/AppData/vscodium-web/config
        target: /config
    container_name: vscodium-web
    x-runtipi:
      is_main: true
      internal_port: 8000
x-runtipi:
  schema_version: 2
