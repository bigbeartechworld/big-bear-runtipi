services:
  vscodium-web:
    image: linuxserver/vscodium-web:1.140.06880@sha256:5907b6ec2b6a306aec3a330b82ab54c36a97a550db1a7919b65e4ffabdb7fc58
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      CONNECTION_TOKEN: ''
      CONNECTION_TOKEN_FILE: ''
      SUDO_PASSWORD: ''
      SUDO_PASSWORD_HASH: ''
      CODE_ARGS: ''
    volumes:
      - type: bind
        source: /DATA/AppData/vscodium-web/config
        target: /config
    container_name: vscodium-web
    x-runtipi:
      is_main: true
      internal_port: 8000
x-runtipi:
  schema_version: 2
