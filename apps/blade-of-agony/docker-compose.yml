services:
  blade-of-agony:
    image: linuxserver/blade-of-agony:3.1.20261008@sha256:cef2f190c8ce4676a8d413927825b4ba366bac6d7ee1d75a5a15f27ef21cc7c5
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: ${APP_PORT}
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/blade-of-agony/config
        target: /config
    container_name: blade-of-agony
    labels:
      runtipi.managed: "true"
    networks:
      - tipi_main_network
networks:
  tipi_main_network:
    external: true
