services:
  blade-of-agony:
    image: linuxserver/blade-of-agony:3.1.20260917@sha256:8926be7bc8b47c278a1436c5aaef79170be601adb8854d5e5156ea6de0607984
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: ${APP_PORT}
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/blade-of-agony/config
        target: /config
    container_name: blade-of-agony
    labels:
      runtipi.managed: "true"
    networks:
      - tipi_main_network
networks:
  tipi_main_network:
    external: true
