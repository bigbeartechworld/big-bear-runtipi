services:
  remmina:
    image: linuxserver/remmina:1.4.43@sha256:bf0f63faa3534ac55c1a5bcb76968f3c967e0ce573eec3e6b70955e08ae9b08e
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/remmina/config
        target: /config
    container_name: remmina
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
