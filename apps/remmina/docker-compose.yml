services:
  remmina:
    image: linuxserver/remmina:1.4.43@sha256:b69842b38336b1cee9e9368fa781c883532ccf6664cd0b7ae186d8e5948c81e7
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/remmina/config
        target: /config
    container_name: remmina
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
