services:
  remmina:
    image: linuxserver/remmina:1.4.43@sha256:46d855c0eabe231edeaec9b138514e484d4b19f412dc4ae90076ca2d488d98b3
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/remmina/config
        target: /config
    container_name: remmina
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
