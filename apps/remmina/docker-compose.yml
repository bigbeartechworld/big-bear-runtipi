services:
  remmina:
    image: linuxserver/remmina:1.4.43@sha256:99a10c613e87f8f31acb1f25565b4c7c8d96b8fbe2c6528897b03d179a8918a6
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/remmina/config
        target: /config
    container_name: remmina
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
