services:
  inkscape:
    image: linuxserver/inkscape:1.4.2@sha256:704c79928864c7e66c27a2925d5676661bdf72e0cbbb7ad37f7ed2e9d82e2e03
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/inkscape/config
        target: /config
    container_name: inkscape
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
