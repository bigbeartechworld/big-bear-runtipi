services:
  inkscape:
    image: linuxserver/inkscape:1.4.2@sha256:31db35960100e924a3f6bd836c7b49e1dd8bc63858acef1618455fda4e6c337e
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: ${APP_PORT}
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/inkscape/config
        target: /config
    container_name: inkscape
    labels:
      runtipi.managed: "true"
    networks:
      - tipi_main_network
networks:
  tipi_main_network:
    external: true
