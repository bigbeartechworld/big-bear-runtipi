services:
  inkscape:
    image: linuxserver/inkscape:1.4.2@sha256:a33e7cbd9c8039b11f681d87bc07e9916e73c4bb245fa5df16fd227afdb8cb86
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/inkscape/config
        target: /config
    container_name: inkscape
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
