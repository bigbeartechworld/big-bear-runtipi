services:
  inkscape:
    image: linuxserver/inkscape:1.4.2@sha256:a7d4088f251e59123595acf94d0c5502ff17fc76ee38790b7b5335bf1377d52c
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/inkscape/config
        target: /config
    container_name: inkscape
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
