# Configuration for chatpad setup

# Name of the big-bear-chatpad application
# Service definitions for the big-bear-chatpad application
services:
  chatpad:
    # Name of the container
    container_name: chatpad
    # Image to be used for the container
    image: ghcr.io/deiucanta/chatpad:f45cd53bc410412610c1ba1cbd84cd137d8e167d@sha256:b0b2364a3ad97812bd88c1f33541ba4281e0bbff1878b509cef354ae7ec3278d
    # Container restart policy
    restart: unless-stopped
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
