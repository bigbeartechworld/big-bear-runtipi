services:
  webgrabplus:
    image: linuxserver/webgrabplus:5.6.1@sha256:4e4d9d00a3de6a4e7fcc461e7fc2c9d34a988ad77fa2c27a41b78c7af27f2deb
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/webgrabplus/config
        target: /config
      - type: bind
        source: /DATA/AppData/webgrabplus/data
        target: /data
    container_name: webgrabplus
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
