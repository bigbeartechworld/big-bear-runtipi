services:
  webgrabplus:
    image: linuxserver/webgrabplus:5.6.1@sha256:d74b22735d82bc70609b1844040d57385568254a1e5c1328b14d14409284b226
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/webgrabplus/config
        target: /config
      - type: bind
        source: /DATA/AppData/webgrabplus/data
        target: /data
    container_name: webgrabplus
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
