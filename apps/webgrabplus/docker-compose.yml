services:
  webgrabplus:
    image: linuxserver/webgrabplus:5.6.1@sha256:c64881ad63a79ee1f8ce14541d59cbeae580c2c0bcae44e48e6a237e1906b2d2
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/webgrabplus/config
        target: /config
      - type: bind
        source: /DATA/AppData/webgrabplus/data
        target: /data
    container_name: webgrabplus
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
