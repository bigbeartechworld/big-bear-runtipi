services:
  your-spotify:
    image: linuxserver/your_spotify:1.20.0@sha256:3eeba4189eb6a0f5926d7f5ff0b26098fca719a38d6fc1789e6add0f3d15feb6
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      APP_URL: ''
      SPOTIFY_PUBLIC: ''
      SPOTIFY_SECRET: ''
      SPOTIFY_API_DELAY_MS: ''
      CORS: ''
      MONGO_ENDPOINT: ''
    volumes:
      - type: bind
        source: /DATA/AppData/your_spotify/config
        target: /config
    container_name: your-spotify
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
