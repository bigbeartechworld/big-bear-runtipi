services:
  your-spotify:
    image: linuxserver/your_spotify:1.20.0@sha256:34f592ef352cce88db8f64ca502d646b17aa2ecd6076df47e053241b0dbef2da
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      APP_URL: ''
      SPOTIFY_PUBLIC: ''
      SPOTIFY_SECRET: ''
      SPOTIFY_API_DELAY_MS: ''
      CORS: ''
      MONGO_ENDPOINT: ''
    volumes:
      - type: bind
        source: /DATA/AppData/your_spotify/config
        target: /config
    container_name: your-spotify
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
