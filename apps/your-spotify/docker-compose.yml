services:
  your-spotify:
    image: linuxserver/your_spotify:1.20.0@sha256:ecc392c13258df4bd403d09c33be896d3883e31a68241c211a45f20a484931a8
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      APP_URL: ''
      SPOTIFY_PUBLIC: ''
      SPOTIFY_SECRET: ''
      SPOTIFY_API_DELAY_MS: ''
      CORS: ''
      MONGO_ENDPOINT: ''
    volumes:
      - type: bind
        source: /DATA/AppData/your_spotify/config
        target: /config
    container_name: your-spotify
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
