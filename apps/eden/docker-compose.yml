services:
  eden:
    image: linuxserver/eden:0.2.1@sha256:cf7267aaa8aeafcd67bfa107a966e5fe7eeed88022fc551a975cfda1cab6ded4
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/eden/config
        target: /config
    container_name: eden
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
