services:
  eden:
    image: linuxserver/eden:0.2.1@sha256:1b1dc1fa8ded644ad29207d9fa17221073b369c12968651c8305008869e09640
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/eden/config
        target: /config
    container_name: eden
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
