services:
  eden:
    image: linuxserver/eden:0.2.1@sha256:934072cb6050caeb9f2fd1b76ddfb9861e6d5065924836dd67641103e3bb1cac
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/eden/config
        target: /config
    container_name: eden
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
