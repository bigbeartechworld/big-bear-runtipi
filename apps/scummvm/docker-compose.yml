services:
  scummvm:
    image: linuxserver/scummvm:2026.4.0@sha256:4a03c7f05c56a3fbdbec49557f3f17becd7d5a7d770710aa6b59b8654909f59d
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/scummvm/config
        target: /config
    container_name: scummvm
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
