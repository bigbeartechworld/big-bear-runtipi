services:
  scummvm:
    image: linuxserver/scummvm:2026.4.0@sha256:91dbc3a65017b3a301b31d00fe5d8c0e9c65e6bd36041991eb6a539f13b58089
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/scummvm/config
        target: /config
    container_name: scummvm
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
