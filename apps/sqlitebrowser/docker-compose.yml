services:
  sqlitebrowser:
    image: linuxserver/sqlitebrowser:18.04.1@sha256:03f747bdf1f035d0752693cb0ff415a508badaf0de28bfe7a1765009c51ed6ed
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/sqlitebrowser/config
        target: /config
    container_name: sqlitebrowser
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
