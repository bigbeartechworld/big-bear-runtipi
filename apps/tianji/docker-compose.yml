# Configuration for tianji setup

# Name of the big-bear-tianji application
# Service definitions for the big-bear-tianji application
services:
  # Postgres database
  big-bear-tianji-db:
    container_name: big-bear-tianji-db
    image: postgres:15.4-alpine@sha256:35ce2187f2f7fb75e8e79493e13743596c21eb3789ff41ece145ae04d06e93a5
    environment:
      POSTGRES_DB: tianji
      POSTGRES_USER: tianji-user
      POSTGRES_PASSWORD: 227453b7-1286-48cc-b471-1c269495c5fc
    volumes:
      - ${APP_DATA_DIR}/pgdata:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - big_bear_tianji_network
  tianji:
    # Name of the container
    container_name: tianji
    # Image to be used for the container
    image: moonrailgun/tianji:1.33.12@sha256:18bf2e3d3806ceadc6be32708dfe8f907908f2f61abaaec889a830cb4d13824a
    # Container restart policy
    restart: unless-stopped
    # Environment variables for the container
    environment:
      DATABASE_URL: postgresql://tianji-user:227453b7-1286-48cc-b471-1c269495c5fc@big-bear-tianji-db:5432/tianji
      JWT_SECRET: replace-me-with-a-random-string
      ALLOW_REGISTER: "false"
      ALLOW_OPENAPI: "true"
    networks:
      - big_bear_tianji_network
    depends_on:
      - big-bear-tianji-db
    x-runtipi:
      is_main: true
      internal_port: 12345
networks:
  big_bear_tianji_network:
    driver: bridge
x-runtipi:
  schema_version: 2
