services:
  thunderbird:
    image: linuxserver/thunderbird:1140.17.0@sha256:580b7baa630b826f599609d82013a6a17c140084756276cd5ce639d5abcdd5cd
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/thunderbird/config
        target: /config
    container_name: thunderbird
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
