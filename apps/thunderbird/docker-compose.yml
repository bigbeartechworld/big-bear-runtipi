services:
  thunderbird:
    image: linuxserver/thunderbird:1140.17.0@sha256:fe03c975f7f3caad262438b7bd599ae3415c3d5cc07ef9751a3e7837e88d1192
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/thunderbird/config
        target: /config
    container_name: thunderbird
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
