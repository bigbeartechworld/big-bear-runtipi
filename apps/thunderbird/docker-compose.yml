services:
  thunderbird:
    image: linuxserver/thunderbird:1140.16.0@sha256:5d0ad6fe32c9b72b6eb42a049a1f76d8445612f2ad355937ea23295d8cde06ae
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/thunderbird/config
        target: /config
    container_name: thunderbird
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
