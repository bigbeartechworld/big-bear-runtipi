services:
  msedge:
    image: linuxserver/msedge:156.0.4314@sha256:8aa36fce1bd49d78d315f9a2581bda537b555afec381e73a285eeccba7049ed3
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      EDGE_CLI: ''
    volumes:
      - type: bind
        source: /DATA/AppData/msedge/config
        target: /config
    container_name: msedge
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
