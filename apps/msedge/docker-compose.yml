services:
  msedge:
    image: linuxserver/msedge:156.0.4314@sha256:d00157a6c27389bc68f26b87c407d98df5361ab65771bea6469682c25c254e01
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      EDGE_CLI: ''
    volumes:
      - type: bind
        source: /DATA/AppData/msedge/config
        target: /config
    container_name: msedge
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
