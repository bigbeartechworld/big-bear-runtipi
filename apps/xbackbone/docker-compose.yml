services:
  xbackbone:
    image: linuxserver/xbackbone:3.8.2@sha256:85d35185ba8bd0a4dfd15e9ed3f0730c3499ec00364174b45bc351ca3542a63d
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/xbackbone/config
        target: /config
    container_name: xbackbone
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
