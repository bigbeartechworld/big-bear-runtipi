services:
  xbackbone:
    image: linuxserver/xbackbone:3.8.2@sha256:c38a46cfd7d211272d63a7623f9e94845746b2727e2cfb3e97c235a07830d712
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/xbackbone/config
        target: /config
    container_name: xbackbone
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
