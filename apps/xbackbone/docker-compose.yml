services:
  xbackbone:
    image: linuxserver/xbackbone:3.8.2@sha256:c95e7777660c282453a5c16036b3fb05656b0e84ffe1a9a0b987335bd9eb9d7e
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/xbackbone/config
        target: /config
    container_name: xbackbone
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
