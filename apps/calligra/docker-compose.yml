services:
  calligra:
    image: linuxserver/calligra:3.2.1@sha256:7667e2f4b9d1ada53c510e05db59ab2233ac4b976476eadbdd4fb58ab19f245c
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/calligra/config
        target: /config
    container_name: calligra
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
