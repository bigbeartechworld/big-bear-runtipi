services:
  calligra:
    image: linuxserver/calligra:3.2.1@sha256:46f113c44f246afa88e6578de2b9eb769ffe5421464889733895e7d2ecb3e301
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/calligra/config
        target: /config
    container_name: calligra
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
