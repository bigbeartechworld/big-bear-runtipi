services:
  calligra:
    image: linuxserver/calligra:3.2.1@sha256:c1251088057743be3c8ff5c78b02c225db12e792b4bff81ab532143e989907ed
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/calligra/config
        target: /config
    container_name: calligra
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
