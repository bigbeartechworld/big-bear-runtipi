services:
  calligra:
    image: linuxserver/calligra:3.2.1@sha256:e78dbca86e4381bc9cc4ef5835d02915e944ce77fd7ae58cb2bbf6a3c42ed003
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/calligra/config
        target: /config
    container_name: calligra
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
