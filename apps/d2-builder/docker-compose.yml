services:
  d2-builder:
    image: linuxserver/d2-builder:0.9.0@sha256:990e2a8c29d49a049eda00b1cf7d4f81a33ef3497b49c9285f2699911450f508
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/d2-builder/config
        target: /config
    container_name: d2-builder
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
