services:
  d2-builder:
    image: linuxserver/d2-builder:0.9.0@sha256:728e6ecb5270a091d768707608826735285a16ba2c4b9ce121ac2239f8fa31a0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/d2-builder/config
        target: /config
    container_name: d2-builder
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
