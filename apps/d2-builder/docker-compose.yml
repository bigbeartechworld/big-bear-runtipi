services:
  d2-builder:
    image: linuxserver/d2-builder:0.9.0@sha256:7f0d8cc53cb1ff88430a9dc30121f1350bafcd5c97f043b88d879ead04adbaf1
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/d2-builder/config
        target: /config
    container_name: d2-builder
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
