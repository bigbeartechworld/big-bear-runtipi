services:
  d2-builder:
    image: linuxserver/d2-builder:0.9.0@sha256:a6a6c3f337c0801b29bd8897bca9da75d1c9ac716929628546eafb571558a256
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: ${APP_PORT}
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/d2-builder/config
        target: /config
    container_name: d2-builder
    labels:
      runtipi.managed: "true"
    networks:
      - tipi_main_network
networks:
  tipi_main_network:
    external: true
