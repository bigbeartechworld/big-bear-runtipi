services:
  grav:
    image: linuxserver/grav:2.2.11@sha256:b253f091561bbf2772eee6c96f703dd4596b95d589ef75b14724ccf4db72e7e6
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/grav/config
        target: /config
    container_name: grav
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
