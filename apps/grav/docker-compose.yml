services:
  grav:
    image: linuxserver/grav:2.2.10@sha256:314fc7b48f3698ad383f6b50528942d2a65b4c5b7fc7539f78e08b6f830009ee
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/grav/config
        target: /config
    container_name: grav
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
