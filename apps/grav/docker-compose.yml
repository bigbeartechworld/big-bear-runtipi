services:
  grav:
    image: linuxserver/grav:2.2.14@sha256:1cef266eacab55c83faea18e785474a5dd0d05c6061b7b7c17632aafb42b9695
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/grav/config
        target: /config
    container_name: grav
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
