services:
  grav:
    image: linuxserver/grav:2.2.9@sha256:4946e4f4f362efe45eafad32ceedde863229a3b84465e4818535f913763c880a
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/grav/config
        target: /config
    container_name: grav
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
