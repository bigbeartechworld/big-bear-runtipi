services:
  grav:
    image: linuxserver/grav:2.2.13@sha256:a355dd195ae6245bcae467fdfa10b71ae54f0f93c423eb54e3e4c1f920c6fce7
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/grav/config
        target: /config
    container_name: grav
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
