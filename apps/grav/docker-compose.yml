services:
  grav:
    image: linuxserver/grav:2.2.6@sha256:f5ad70c0b859f6cfde0481054ae3ecbe2c034a0700d22c9831a66ac8b41d03ec
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/grav/config
        target: /config
    container_name: grav
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
