services:
  grav:
    image: linuxserver/grav:2.2.12@sha256:b4730b04f2788a943c65577cc1685136ecb3888e1f4b8639be4e28dc37529e6f
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/grav/config
        target: /config
    container_name: grav
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
