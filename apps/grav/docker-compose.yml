services:
  grav:
    image: linuxserver/grav:2.2.4@sha256:7eb1a043e5c7ec95203eb4fdcd63294fb15ece82297dfeae0ec32cfa1664570b
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: ${APP_PORT}
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/grav/config
        target: /config
    container_name: grav
    labels:
      runtipi.managed: "true"
    networks:
      - tipi_main_network
networks:
  tipi_main_network:
    external: true
