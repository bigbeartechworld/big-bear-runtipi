# Configuration for big-bear-domainlocker setup
services:
  postgres:
    container_name: domain-locker-db
    image: postgres:15-alpine@sha256:fe0737ba566a2c5b2a28f34433c0a423261900ec17b9bf7ad115e1aae7e57f1b
    restart: unless-stopped
    environment:
      POSTGRES_DB: domain_locker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changeme2420
    volumes:
      - ${APP_DATA_DIR}/postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d domain_locker"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - tipi_main_network
    labels:
      runtipi.managed: "true"
  updater:
    container_name: domain-locker-updater
    image: alpine:3.24@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6
    restart: unless-stopped
    depends_on:
      domainlocker:
        condition: service_healthy
    networks:
      - tipi_main_network
    command:
      - /bin/sh
      - -c
      - |
        apk add --no-cache curl &&
        echo '0 3 * * * /usr/bin/curl -f -X POST http://domainlocker:3000/api/domain-updater || echo "ERROR: domain-updater failed at $(date)" >&2' > /etc/crontabs/root &&
        echo '0 4 * * * /usr/bin/curl -f -X POST http://domainlocker:3000/api/expiration-reminders || echo "ERROR: expiration-reminders failed at $(date)" >&2' >> /etc/crontabs/root &&
        echo '*/15 * * * * /usr/bin/curl -f -X POST http://domainlocker:3000/api/domain-monitor || echo "ERROR: domain-monitor failed at $(date)" >&2' >> /etc/crontabs/root &&
        echo '0 2 * * 0 /usr/bin/curl -f -X POST http://domainlocker:3000/api/cleanup-monitor-data || echo "ERROR: cleanup-monitor-data failed at $(date)" >&2' >> /etc/crontabs/root &&
        crond -f -L /dev/stdout
    labels:
      runtipi.managed: "true"
  domainlocker:
    container_name: domainlocker
    image: ghcr.io/lissy93/domain-locker:0.2.4@sha256:883716e301b7353327cc82d6bd8e4c5f5d2a93d7f8175e0c10e1d0855f5c4094
    restart: unless-stopped
    environment:
      DL_ENV_TYPE: selfHosted
      DL_PG_HOST: postgres
      DL_PG_PORT: 5432
      DL_PG_USER: postgres
      DL_PG_PASSWORD: changeme2420
      DL_PG_NAME: domain_locker
    ports:
      - ${APP_PORT}:3000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 30s
    networks:
      - tipi_main_network
    labels:
      runtipi.managed: "true"
networks:
  tipi_main_network:
    external: true
