services:
  archivebox:
    image: archivebox/archivebox:0.9.77
    restart: unless-stopped
    environment:
      ALLOWED_HOSTS: '*'
      MEDIA_MAX_SIZE: 500m
      PUBLIC_INDEX: true
      PUBLIC_SNAPSHOTS: true
      PUBLIC_ADD_VIEW: true
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /data
    container_name: archivebox
    x-runtipi:
      is_main: true
      internal_port: 8000
x-runtipi:
  schema_version: 2
