# Configuration for lobe-chat setup

# Name of the big-bear-lobe-chat application
# Service definitions for the big-bear-lobe-chat application
services:
  lobe-chat:
    # Name of the container
    container_name: lobe-chat
    # Image to be used for the container
    image: lobehub/lobe-chat:1.143.3@sha256:b2d2454525523d9f0a19c79661f83ec45f13363dbadd5c1180887e77af35d872
    # Container restart policy
    restart: unless-stopped
    # Environment variables for the container
    environment:
      - OPENAI_API_KEY=""
      - OPENAI_PROXY_URL=""
      - CUSTOM_MODELS=""
      - ACCESS_CODE=""
    x-runtipi:
      is_main: true
      internal_port: 3210
x-runtipi:
  schema_version: 2
