services:
  mysql-workbench:
    image: linuxserver/mysql-workbench:8.0.47@sha256:280372c734cb9fc0ce5eeebff04fb70f7374ed69b1e580b3b3eab6242520be18
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: ${APP_PORT}
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/mysql-workbench/config
        target: /config
    container_name: mysql-workbench
    labels:
      runtipi.managed: "true"
    networks:
      - tipi_main_network
networks:
  tipi_main_network:
    external: true
