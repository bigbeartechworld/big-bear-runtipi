services:
  mysql-workbench:
    image: linuxserver/mysql-workbench:8.0.47@sha256:7a9d8e4d6dd3907c6a2e6468617fbc3d1ba8a8847185a817369124de7ac01cde
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/mysql-workbench/config
        target: /config
    container_name: mysql-workbench
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
