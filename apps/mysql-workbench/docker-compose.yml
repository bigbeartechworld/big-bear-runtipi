services:
  mysql-workbench:
    image: linuxserver/mysql-workbench:8.0.47@sha256:af86f67fcbf7d1e0da9610fb2bf05eda77228ca4995df58976b6f35e42ebd1ac
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: ${APP_PORT}
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/mysql-workbench/config
        target: /config
    container_name: mysql-workbench
    labels:
      runtipi.managed: "true"
    networks:
      - tipi_main_network
networks:
  tipi_main_network:
    external: true
