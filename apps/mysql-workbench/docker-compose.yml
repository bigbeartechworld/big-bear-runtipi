services:
  mysql-workbench:
    image: linuxserver/mysql-workbench:8.0.47@sha256:71e59c22815a5b7cce5817db74b717dfc8c4bd0b7d360e540a6dfc16a422a6c4
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/mysql-workbench/config
        target: /config
    container_name: mysql-workbench
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
