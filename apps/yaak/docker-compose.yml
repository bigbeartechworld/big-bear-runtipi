services:
  yaak:
    image: linuxserver/yaak:2026.9.0@sha256:baedb709835196606a4c9669e432f8d6f92732b4d6433fda445dad7f9c60c337
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/yaak/config
        target: /config
    container_name: yaak
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
