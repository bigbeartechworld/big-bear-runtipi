services:
  yaak:
    image: linuxserver/yaak:2026.8.1@sha256:03ee7b148139da77eaa2c2d29db2d15025c2f8e62331d7c2d8f02df1838a9381
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/yaak/config
        target: /config
    container_name: yaak
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
