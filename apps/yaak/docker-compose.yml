services:
  yaak:
    image: linuxserver/yaak:2026.8.1@sha256:03ee7b148139da77eaa2c2d29db2d15025c2f8e62331d7c2d8f02df1838a9381
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: ${APP_PORT}
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/yaak/config
        target: /config
    container_name: yaak
    labels:
      runtipi.managed: "true"
    networks:
      - tipi_main_network
networks:
  tipi_main_network:
    external: true
