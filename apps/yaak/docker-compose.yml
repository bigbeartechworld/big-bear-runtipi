services:
  yaak:
    image: linuxserver/yaak:2026.9.0@sha256:fc83e838f56dfc15a5ed59192568d502c8bc48a7d81e6b2eea0ae489eed8e364
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/yaak/config
        target: /config
    container_name: yaak
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
