services:
  yaak:
    image: linuxserver/yaak:2026.9.0@sha256:0a5d99db725c0ba19974490d70b294348bd8ed5059f6564e94759bb65c6f21ca
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/yaak/config
        target: /config
    container_name: yaak
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
