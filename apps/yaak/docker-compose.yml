services:
  yaak:
    image: linuxserver/yaak:2026.9.0@sha256:a572153e208c9cf1b1dc7024a7fc5a09fcfb1b98df1d548089c7f3c1bdcecc8d
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/yaak/config
        target: /config
    container_name: yaak
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
