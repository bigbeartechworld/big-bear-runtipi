services:
  privatebin:
    image: privatebin/nginx-fpm-alpine:2.1.0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/data
        target: /srv/data
      - type: bind
        source: /DATA/AppData/$AppID/config
        target: /srv/cfg
    container_name: privatebin
    x-runtipi:
      is_main: true
      internal_port: 8080
x-runtipi:
  schema_version: 2
