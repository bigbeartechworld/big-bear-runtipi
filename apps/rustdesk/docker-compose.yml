services:
  rustdesk:
    image: linuxserver/rustdesk:1.5.0@sha256:f14fa6dba1558579a8613d266e7e9ea0009b77c5d45e4010e96bbaa81c39bacf
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/rustdesk/config
        target: /config
    container_name: rustdesk
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
