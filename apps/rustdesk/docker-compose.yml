services:
  rustdesk:
    image: linuxserver/rustdesk:1.5.0@sha256:f7fd6d7dfa2e92dc98153e70c881443d5ab963acc6ed1dd2571dcf7593f63dc3
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/rustdesk/config
        target: /config
    container_name: rustdesk
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
