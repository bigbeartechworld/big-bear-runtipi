services:
  rustdesk:
    image: linuxserver/rustdesk:1.5.0@sha256:edaf38e89697031bfe1d65ffacdffacb8826dca780b1932f9264f8f289d303f5
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/rustdesk/config
        target: /config
    container_name: rustdesk
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
