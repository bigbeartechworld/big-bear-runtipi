services:
  dolphin:
    image: linuxserver/dolphin:version-2606a@sha256:2934f9f01b98669242408c97cfd927ccf308cab108c380f5d4b8dfded5eb5055
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/dolphin/config
        target: /config
    container_name: dolphin
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
