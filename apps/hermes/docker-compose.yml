services:
  hermes:
    image: nousresearch/hermes-agent:v2026.9.24@sha256:fca358f12efd65bfaaca05884166f15c0e2788375ca30d77061ac1ebc96452b7
    container_name: hermes
    restart: unless-stopped
    command:
      - gateway
      - run
    volumes:
      - ${APP_DATA_DIR}/data:/opt/data
    environment:
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: zimaos
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ""
    deploy:
      resources:
        reservations:
          memory: 1G
    x-runtipi:
      is_main: true
      internal_port: 9119
x-runtipi:
  schema_version: 2
