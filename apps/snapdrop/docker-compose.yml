services:
  snapdrop:
    image: linuxserver/snapdrop:version-f88d46ed@sha256:3a1423028607899c0bdb62fb3c7a02d43862bb24098cb13a78d91a795a7340d5
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/snapdrop/config
        target: /config
    container_name: snapdrop
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
