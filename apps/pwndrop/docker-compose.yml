services:
  pwndrop:
    image: linuxserver/pwndrop:1.0.1@sha256:988739a36fac0a7264a3245ffe78c7c9277a575f204227997f1b82f32351ecd0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      SECRET_PATH: ''
    ports:
      - target: 8080
        published: ${APP_PORT}
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/pwndrop/config
        target: /config
    container_name: pwndrop
    labels:
      runtipi.managed: "true"
    networks:
      - tipi_main_network
networks:
  tipi_main_network:
    external: true
