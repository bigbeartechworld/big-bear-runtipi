services:
  pwndrop:
    image: linuxserver/pwndrop:1.0.1@sha256:b272271a51cf3e80279a00553ce3d5c854bdb970b7d79f89632adc357fe40236
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      SECRET_PATH: ''
    volumes:
      - type: bind
        source: /DATA/AppData/pwndrop/config
        target: /config
    container_name: pwndrop
    x-runtipi:
      is_main: true
      internal_port: 8080
x-runtipi:
  schema_version: 2
