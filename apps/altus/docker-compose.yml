services:
  altus:
    image: linuxserver/altus:5.8.1@sha256:e4df4114c1cc350bb475c4d2f6616dcf434659cf4557fa8738759c089fd51fea
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/altus/config
        target: /config
    container_name: altus
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
