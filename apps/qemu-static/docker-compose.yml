services:
  qemu-static:
    image: linuxserver/qemu-static:10.0.13@sha256:85959e8657d2e2ec534febf9c34fb09198557191828d7c68361094803ce23e37
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/qemu-static/config
        target: /config
    container_name: qemu-static
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
