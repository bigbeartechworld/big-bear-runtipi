services:
  qemu-static:
    image: linuxserver/qemu-static:10.0.2@sha256:843aca5fb5640749693281a3bb5208e90ee7e1e9ce1486afdaed95eb500ea326
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/qemu-static/config
        target: /config
    container_name: qemu-static
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
