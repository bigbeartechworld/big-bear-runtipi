services:
  mediaelch:
    image: linuxserver/mediaelch:2.12.0@sha256:55132d0b6a46118d221a2de0e7b2249efe572813d594f5e14e778e46d155be35
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/mediaelch/config
        target: /config
    container_name: mediaelch
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
