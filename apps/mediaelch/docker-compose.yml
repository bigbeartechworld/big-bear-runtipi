services:
  mediaelch:
    image: linuxserver/mediaelch:2.12.0@sha256:aa208fee2929652751febabc2bfcd651b6d7dbec77a5adde66d06d86a5efe082
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: ${APP_PORT}
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/mediaelch/config
        target: /config
    container_name: mediaelch
    labels:
      runtipi.managed: "true"
    networks:
      - tipi_main_network
networks:
  tipi_main_network:
    external: true
