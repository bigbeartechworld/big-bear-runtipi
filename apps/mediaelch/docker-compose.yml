services:
  mediaelch:
    image: linuxserver/mediaelch:2.12.0@sha256:62548eba071dfeaa2185bf035bd8d133ac2e68d76e9fed0a8e3fbe47a38262e3
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/mediaelch/config
        target: /config
    container_name: mediaelch
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
