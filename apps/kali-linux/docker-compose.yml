services:
  kali-linux:
    image: linuxserver/kali-linux:version-45f3494e@sha256:3a082bb348852e97567153ffdd79a532924ff53fccc04fd56bbc2d971139d0d6
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/kali-linux/config
        target: /config
    container_name: kali-linux
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
