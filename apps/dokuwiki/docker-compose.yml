services:
  dokuwiki:
    image: linuxserver/dokuwiki:version-2026-07-14c@sha256:f39c992b29016fe10f888e3723481d470a3c19d409f65e1655645bbb223ad9a1
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/dokuwiki/config
        target: /config
    container_name: dokuwiki
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
