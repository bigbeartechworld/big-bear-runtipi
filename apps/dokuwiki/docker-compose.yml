services:
  dokuwiki:
    image: linuxserver/dokuwiki:version-2026-07-14c@sha256:2a94a05587e8badf13a5500fe2bb2cfd0c1f74e9b2e952b96d304dc99aab126f
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: ${APP_PORT}
        protocol: tcp
      - target: 443
        published: 443
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/dokuwiki/config
        target: /config
    container_name: dokuwiki
    labels:
      runtipi.managed: "true"
    networks:
      - tipi_main_network
networks:
  tipi_main_network:
    external: true
