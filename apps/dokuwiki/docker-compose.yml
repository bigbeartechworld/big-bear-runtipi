services:
  dokuwiki:
    image: linuxserver/dokuwiki:version-2026-07-14c@sha256:0e4263ac90c82f30b1ac114b2b4730abe443c310a875a8ec802bc6abb1321c31
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/dokuwiki/config
        target: /config
    container_name: dokuwiki
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
