services:
  dokuwiki:
    image: linuxserver/dokuwiki:version-2026-07-14c@sha256:2a94a05587e8badf13a5500fe2bb2cfd0c1f74e9b2e952b96d304dc99aab126f
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/dokuwiki/config
        target: /config
    container_name: dokuwiki
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
