services:
  dokuwiki:
    image: linuxserver/dokuwiki:version-2026-07-14c@sha256:fac142ae9f7df5d3457037bc8bb668f8bfc6a6b9e02d5d1a5743bf1d030f9a10
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/dokuwiki/config
        target: /config
    container_name: dokuwiki
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
