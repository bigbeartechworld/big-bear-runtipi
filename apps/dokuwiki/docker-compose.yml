services:
  dokuwiki:
    image: linuxserver/dokuwiki:version-2026-07-14c@sha256:1abb54178537929dd752223a70e36c53763799885db87590d0875597fb4aaacf
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: ${APP_PORT}
        protocol: tcp
      - target: 443
        published: 443
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/dokuwiki/config
        target: /config
    container_name: dokuwiki
    labels:
      runtipi.managed: "true"
    networks:
      - tipi_main_network
networks:
  tipi_main_network:
    external: true
