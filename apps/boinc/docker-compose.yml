services:
  boinc:
    image: linuxserver/boinc:18.04.1@sha256:8c81947b3f5771fa15fd47fd7c978e5c6121d516e2c1d3de039808bf9378006b
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      PASSWORD: ''
    volumes:
      - type: bind
        source: /DATA/AppData/boinc/config
        target: /config
    container_name: boinc
    x-runtipi:
      is_main: true
      internal_port: 8080
x-runtipi:
  schema_version: 2
