# Configuration for obsidian setup

# Name of the big-bear-obsidian application
# Service definitions for the big-bear-obsidian application
services:
  obsidian:
    # Name of the container
    container_name: obsidian
    # Image to be used for the container
    image: linuxserver/obsidian:1.13.7@sha256:a3324c3380f40a70d98058636a47db4afaca261907751a720afa4132c7f4c14e
    # Container restart policy
    restart: unless-stopped
    # Environment variables
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    # Volumes to be mounted to the container
    volumes:
      - ${APP_DATA_DIR}/config:/config
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
