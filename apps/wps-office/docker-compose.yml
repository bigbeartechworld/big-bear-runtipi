services:
  wps-office:
    image: linuxserver/wps-office:11.1.0@sha256:8f0def94065abee8ef8aaf28744b341f7b599eb97fff9daf234ef6ff810aa6d2
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/wps-office/config
        target: /config
    container_name: wps-office
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
