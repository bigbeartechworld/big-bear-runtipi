services:
  wps-office:
    image: linuxserver/wps-office:11.1.0@sha256:72a7f80c2c45a118b2357c6c4264a738783623678697f7761d193dd45e430512
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/wps-office/config
        target: /config
    container_name: wps-office
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
