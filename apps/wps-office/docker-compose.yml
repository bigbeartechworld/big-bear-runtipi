services:
  wps-office:
    image: linuxserver/wps-office:11.1.0@sha256:f75d78cf61505b4fc464bc0db227ecec0bedf47603f5fbbb54deed2848e74d65
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/wps-office/config
        target: /config
    container_name: wps-office
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
