services:
  wps-office:
    image: linuxserver/wps-office:11.1.0@sha256:6fc3015bf29fc4a22982bbe730105346a2addc6cdf597e7ea95969bab0550a11
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/wps-office/config
        target: /config
    container_name: wps-office
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
