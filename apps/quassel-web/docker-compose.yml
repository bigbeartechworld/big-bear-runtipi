services:
  quassel-web:
    image: linuxserver/quassel-web:version-019bfdc1@sha256:15453e655257907853d02a41903c255f0fd4da8a759f13f73b2573dca2d981ba
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      QUASSEL_CORE: ''
      QUASSEL_PORT: ''
      QUASSEL_HTTPS: ''
      URL_BASE: ''
    volumes:
      - type: bind
        source: /DATA/AppData/quassel-web/config
        target: /config
    container_name: quassel-web
    x-runtipi:
      is_main: true
      internal_port: 64080
x-runtipi:
  schema_version: 2
