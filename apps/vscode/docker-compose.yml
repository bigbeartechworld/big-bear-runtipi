services:
  vscode:
    image: linuxserver/vscode:1.143.1@sha256:87fbd7ffaca9302fc0688897c3aa65038792c74f80ab562f289bb003c24b3fee
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/vscode/config
        target: /config
    container_name: vscode
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
