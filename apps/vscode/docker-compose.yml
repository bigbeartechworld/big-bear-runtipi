services:
  vscode:
    image: linuxserver/vscode:1.140.0@sha256:008276f42f301068df07ee08a9a271dc33c3cdddef50398c660e06859de2a55c
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/vscode/config
        target: /config
    container_name: vscode
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
