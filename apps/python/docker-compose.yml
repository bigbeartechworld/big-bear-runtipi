services:
  python:
    image: linuxserver/python:3.15.2@sha256:6c526db6ad81da8cea25cfeddd50051c2a9970a67d96fadc308c217a7e2d5d51
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/python/config
        target: /config
    container_name: python
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
