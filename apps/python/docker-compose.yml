services:
  python:
    image: linuxserver/python:3.15.0@sha256:cefdc592b20898169ddceda2bf9dbed936899def8790e1daaa684197cf9fd4a4
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/python/config
        target: /config
    container_name: python
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
