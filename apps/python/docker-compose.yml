services:
  python:
    image: linuxserver/python:3.15.1@sha256:f3f0f364d2a301441e6a8c304a1178cab0cabe975322044ba7c07314f9ed0c9e
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/python/config
        target: /config
    container_name: python
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
