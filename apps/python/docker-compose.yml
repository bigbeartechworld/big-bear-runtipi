services:
  python:
    image: linuxserver/python:3.14.8@sha256:f4ed298459c1d851c245f7cbfc97fdd7ea675d1ea0e11c922f83df29208be365
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: ${APP_PORT}
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/python/config
        target: /config
    container_name: python
    labels:
      runtipi.managed: "true"
    networks:
      - tipi_main_network
networks:
  tipi_main_network:
    external: true
