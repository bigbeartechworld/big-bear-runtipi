services:
  webcord:
    image: linuxserver/webcord:4.14.0@sha256:1a411f2a5c679bc0839301a7618e05b819ada9000b9792b52b55f3387c47d52b
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/webcord/config
        target: /config
    container_name: webcord
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
