services:
  webcord:
    image: linuxserver/webcord:4.14.0@sha256:56fd4fb3ed40ff914601424e63b81556fc169bec88607a24aded67017128cf2e
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/webcord/config
        target: /config
    container_name: webcord
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
