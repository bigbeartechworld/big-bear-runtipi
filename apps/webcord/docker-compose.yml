services:
  webcord:
    image: linuxserver/webcord:4.14.0@sha256:bec02d38c1edef31921d2b42150529dbdb97d821075f9146ac680a211d12916f
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/webcord/config
        target: /config
    container_name: webcord
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
