services:
  citron:
    image: linuxserver/citron:2026.02.1@sha256:6d955bd6dce826c40f3ffdb793c4711826179cf411c2f72c4c27358413195ddb
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /srv/lsio/citron/config
        target: /config
    container_name: citron
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
