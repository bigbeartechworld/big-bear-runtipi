services:
  build-agent:
    image: linuxserver/build-agent:version-0296acb5@sha256:63e38c87cfb1d73beff12975706ffee41c7bb42db41c305648871df98cc24ec0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/build-agent/config
        target: /config
    container_name: build-agent
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
