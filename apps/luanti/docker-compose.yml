services:
  luanti:
    image: linuxserver/luanti:5.18.0@sha256:77932c3828dd5943cc46f8b03dcb1837ed184f809816518224c88c533da5f9f0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      CLI_ARGS: ''
    volumes:
      - type: bind
        source: /DATA/AppData/luanti/config/.minetest
        target: /config/.minetest
    container_name: luanti
    x-runtipi:
      is_main: true
      internal_port: 30000
x-runtipi:
  schema_version: 2
