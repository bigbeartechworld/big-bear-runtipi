services:
  luanti:
    image: linuxserver/luanti:5.17.0@sha256:8088008f96480583f85570811e2d0b0e150c64a9400879378bda0182013cc4ce
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      CLI_ARGS: ''
    ports:
      - target: 30000
        published: ${APP_PORT}
        protocol: udp
    volumes:
      - type: bind
        source: /DATA/AppData/luanti/config/.minetest
        target: /config/.minetest
    container_name: luanti
    labels:
      runtipi.managed: "true"
    networks:
      - tipi_main_network
networks:
  tipi_main_network:
    external: true
