services:
  luanti:
    image: linuxserver/luanti:5.17.0@sha256:bfdd74733bbeed3c49a5b7cecfbd2b4b5fe3d1ff813aff9ddf31cc9ccef25aea
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      CLI_ARGS: ''
    volumes:
      - type: bind
        source: /DATA/AppData/luanti/config/.minetest
        target: /config/.minetest
    container_name: luanti
    x-runtipi:
      is_main: true
      internal_port: 30000
x-runtipi:
  schema_version: 2
