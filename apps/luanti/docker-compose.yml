services:
  luanti:
    image: linuxserver/luanti:5.17.0@sha256:f0f32b6789504586db3a01e974e0b5ebe3613f50305377dbe5148708569a452c
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      CLI_ARGS: ''
    ports:
      - target: 30000
        published: ${APP_PORT}
        protocol: udp
    volumes:
      - type: bind
        source: /DATA/AppData/luanti/config/.minetest
        target: /config/.minetest
    container_name: luanti
    labels:
      runtipi.managed: "true"
    networks:
      - tipi_main_network
networks:
  tipi_main_network:
    external: true
