services:
  embystat:
    image: linuxserver/embystat:0.2.0@sha256:adc479353fc0b810c21935a8fe3c2d20d9f7027edc9574477d702ec2ad414754
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/embystat/config
        target: /config
    container_name: embystat
    x-runtipi:
      is_main: true
      internal_port: 6555
x-runtipi:
  schema_version: 2
