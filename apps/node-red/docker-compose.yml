# Configuration for node-red setup

# Application Name
# Services used in the application
services:
  node-red:
    # Name of the container
    container_name: node-red
    # Docker image to be used
    image: nodered/node-red:5.0.8@sha256:b5adb6c9dd29ab80c852d82bc87daed84e729dcff9b00ca1bf958e6de470f2c1
    # Restart policy for the service
    restart: unless-stopped
    # Volumes for the service HOST -> CONTAINER
    volumes:
      - ${APP_DATA_DIR}/data:/data
    x-runtipi:
      is_main: true
      internal_port: 1880
x-runtipi:
  schema_version: 2
