services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      POSTGRES_USER: bigbear
      POSTGRES_PASSWORD: dc640cd4-0450-4a94-aedb-ee5b43b32a45
      POSTGRES_DB: casaos
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/postgres/data
        target: /var/lib/postgresql/data
  statping:
    image: statping/statping:v0.90.74
    restart: always
    depends_on:
      - db
    environment:
      VIRTUAL_PORT: 8080
      DB_CONN: postgres
      DB_HOST: db
      DB_USER: bigbear
      DB_PASS: dc640cd4-0450-4a94-aedb-ee5b43b32a45
      DB_DATABASE: casaos
      NAME: ''
      DESCRIPTION: ''
    volumes:
      - type: bind
        source: /DATA/AppData/$AppID/app
        target: /app
    container_name: statping
    x-runtipi:
      is_main: true
      internal_port: 8080
x-runtipi:
  schema_version: 2
