services:
  melonds:
    image: linuxserver/melonds:1.1.20261229@sha256:1b5a28a03910688f5a44236f1c5afe49ad29ff497ba55614e08e5e6d7a5a1e49
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/melonds/config
        target: /config
    container_name: melonds
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
