# Configuration for vert setup

# Name of the big-bear-vert application
# Service definitions for the big-bear-vert application
services:
  vert:
    # Name of the container
    container_name: vert
    # Image to be used for the container
    image: ghcr.io/vert-sh/vert:sha-a1b0b15@sha256:9f69e1f0a61be4882f8b1e9ba35647e8df4a91669fb4c3cdf30aeb88c247c600
    # Container restart policy
    restart: unless-stopped
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
