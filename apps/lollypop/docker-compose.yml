services:
  lollypop:
    image: linuxserver/lollypop:1.4.45@sha256:d0b4550a8646313e67dd023e3e411b9bc9a0709933d3c92dfd2e2c7f11764b71
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/lollypop/config
        target: /config
    container_name: lollypop
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
