services:
  lollypop:
    image: linuxserver/lollypop:1.4.45@sha256:aa525497087ade779351992433c6a6277ede4cdb20076ddbe42a077a63126bbf
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/lollypop/config
        target: /config
    container_name: lollypop
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
