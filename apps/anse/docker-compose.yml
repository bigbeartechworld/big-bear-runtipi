# Configuration for anse setup

# Name of the big-bear-anse application
# Service definitions for the big-bear-anse application
services:
  anse:
    # Name of the container
    container_name: anse
    # Image to be used for the container
    image: ddiu8081/anse:v1.1.11@sha256:fd9afc84b9e1df02ca065170e72994b787e7d2ea881f22eda2fcd2c58e717164
    # Container restart policy
    restart: unless-stopped
    # Environment variables
    environment:
      - PORT=8014
    x-runtipi:
      is_main: true
      internal_port: 8014
x-runtipi:
  schema_version: 2
