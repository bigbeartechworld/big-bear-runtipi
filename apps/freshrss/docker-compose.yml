services:
  freshrss:
    image: linuxserver/freshrss:1.30.1@sha256:d5a11c52ba6987702e899c2c3831946eb959b54af34db96b1fe41194286acfb2
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/freshrss/config
        target: /config
    container_name: freshrss
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
