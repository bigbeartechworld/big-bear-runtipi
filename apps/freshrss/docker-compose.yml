services:
  freshrss:
    image: linuxserver/freshrss:1.30.4@sha256:ad3ebe2553250edcecf74995c051b6426fc85b7ca18e744991cb1ca99c8d943d
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/freshrss/config
        target: /config
    container_name: freshrss
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
