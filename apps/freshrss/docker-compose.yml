services:
  freshrss:
    image: linuxserver/freshrss:1.30.4@sha256:3bdf970c2baebb4e8c8753c84e44c87991888311a437466d669b0016bb7e89c5
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/freshrss/config
        target: /config
    container_name: freshrss
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
