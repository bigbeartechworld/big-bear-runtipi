services:
  freshrss:
    image: linuxserver/freshrss:1.30.2@sha256:f6418c990d37533223fa3fa3ce048edae021a8fd3aac6c46296a03c4c3249bf4
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/freshrss/config
        target: /config
    container_name: freshrss
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
