services:
  cops:
    image: linuxserver/cops:4.5.4@sha256:c2ce7e22a4315aeb06d19c796f9a2b6c5c73dabbd20c528d91a8b729b6ebb182
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/cops/config
        target: /config
      - type: bind
        source: /DATA/AppData/cops/books
        target: /books
    container_name: cops
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
