services:
  cops:
    image: linuxserver/cops:4.5.4@sha256:c345c1bf03422bfc8bbcfeca77219f0358b76685cdd07d3fc949c74f84b24669
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/cops/config
        target: /config
      - type: bind
        source: /DATA/AppData/cops/books
        target: /books
    container_name: cops
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
