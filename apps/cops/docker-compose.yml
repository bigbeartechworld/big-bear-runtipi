services:
  cops:
    image: linuxserver/cops:4.5.4@sha256:c82414569a11e32d02f5eb0708b0233e7a37031234e65a0464ebc842e6dd4e65
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/cops/config
        target: /config
      - type: bind
        source: /DATA/AppData/cops/books
        target: /books
    container_name: cops
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
