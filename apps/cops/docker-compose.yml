services:
  cops:
    image: linuxserver/cops:4.5.4@sha256:b70171a048f50753034760132ab2095495838da1490e90afb13de9719317523b
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/cops/config
        target: /config
      - type: bind
        source: /DATA/AppData/cops/books
        target: /books
    container_name: cops
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
