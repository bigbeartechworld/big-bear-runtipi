services:
  hrconvert2:
    image: dwaaan/hrconvert2-docker:latest
    ports:
      - target: 80
        published: ${APP_PORT}
        protocol: tcp
    restart: unless-stopped
    container_name: hrconvert2
    labels:
      runtipi.managed: "true"
    networks:
      - tipi_main_network
networks:
  tipi_main_network:
    external: true
