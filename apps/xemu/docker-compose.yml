services:
  xemu:
    image: linuxserver/xemu:0.8.134@sha256:69728c7ad980bcef4469c04e7d310e1920403bb82cf6260c87f92cc833f87888
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/xemu/config
        target: /config
    container_name: xemu
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
