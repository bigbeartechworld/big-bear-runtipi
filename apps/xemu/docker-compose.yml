services:
  xemu:
    image: linuxserver/xemu:0.8.134@sha256:6904497c2cc7660e5e356e00a22aed842046584be1771ae0639a8c6a669de4a3
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/xemu/config
        target: /config
    container_name: xemu
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
