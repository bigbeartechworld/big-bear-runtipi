services:
  xemu:
    image: linuxserver/xemu:0.8.134@sha256:ce23bd30c9fe166b3a167b87d6bcb88ee9b29740769ad9fd1ca2182ddb5544cf
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/xemu/config
        target: /config
    container_name: xemu
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
