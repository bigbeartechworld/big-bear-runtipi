services:
  wikijs:
    image: linuxserver/wikijs:2.5.317@sha256:c85bd3099014aee55bbffcf02008c11d68b9f503187b34c9eabe584bd4ff6ab0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      DB_TYPE: $DB_TYPE
      DB_HOST: $DB_HOST
      DB_PORT: $DB_PORT
      DB_NAME: $DB_NAME
      DB_USER: $DB_USER
      DB_PASS: $DB_PASS
    volumes:
      - type: bind
        source: /DATA/AppData/wikijs/config
        target: /config
      - type: bind
        source: /DATA/AppData/wikijs/data
        target: /data
    container_name: wikijs
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
