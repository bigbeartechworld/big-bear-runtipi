services:
  wikijs:
    image: linuxserver/wikijs:2.5.316@sha256:c1cfa35049611f88f8cf2d3b51af635aaf163409208db84827ea3b8fd89cb776
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      DB_TYPE: $DB_TYPE
      DB_HOST: $DB_HOST
      DB_PORT: $DB_PORT
      DB_NAME: $DB_NAME
      DB_USER: $DB_USER
      DB_PASS: $DB_PASS
    volumes:
      - type: bind
        source: /DATA/AppData/wikijs/config
        target: /config
      - type: bind
        source: /DATA/AppData/wikijs/data
        target: /data
    container_name: wikijs
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
