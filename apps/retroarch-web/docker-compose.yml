# Configuration for retroarch-web setup

# Name of the big-bear-retroarch-web application
# Service definitions for the big-bear-retroarch-web application
services:
  retroarch-web:
    # Name of the container
    container_name: retroarch-web
    # Image to be used for the container
    image: inglebard/retroarch-web:latest@sha256:bf03014db81776a715b6289f017be2fc988688f9302590413cd6dcb615f07393
    # Container restart policy
    restart: unless-stopped
    # Environment variables
    environment:
      - ROOT_WWW_PATH="/var/www/html"
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
