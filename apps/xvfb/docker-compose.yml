services:
  xvfb:
    image: linuxserver/xvfb:debiantrixie-version-9d327c0f@sha256:db8c513160544109a1ed06256ea0fbdc8e40fc1f78e6096755f9c30bae8aa38a
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: ${APP_PORT}
        protocol: tcp
    volumes:
      - type: bind
        source: /srv/lsio/xvfb/config
        target: /config
    container_name: xvfb
    labels:
      runtipi.managed: "true"
    networks:
      - tipi_main_network
networks:
  tipi_main_network:
    external: true
