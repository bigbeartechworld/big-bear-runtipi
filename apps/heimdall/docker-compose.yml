services:
  heimdall:
    image: linuxserver/heimdall:2.8.3@sha256:134636c92aa9fd47291f63adb6dc71b7c4e3abdde69e382abbf4a51461f9908a
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      ALLOW_INTERNAL_REQUESTS: ''
    volumes:
      - type: bind
        source: /DATA/AppData/heimdall/config
        target: /config
    container_name: heimdall
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
