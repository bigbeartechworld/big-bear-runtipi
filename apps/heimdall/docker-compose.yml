services:
  heimdall:
    image: linuxserver/heimdall:2.8.3@sha256:928b80d532929a3ff4f53bd49437c721e76334a6d4c9d3d992e522b9ccdd08c2
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      ALLOW_INTERNAL_REQUESTS: ''
    volumes:
      - type: bind
        source: /DATA/AppData/heimdall/config
        target: /config
    container_name: heimdall
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
