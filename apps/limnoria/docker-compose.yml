services:
  limnoria:
    image: linuxserver/limnoria:2026.5.8@sha256:72171932a19ce8adb7efb7b9f963a4418da745e1bd54533f64f39d93f9aefc18
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/limnoria/config
        target: /config
    container_name: limnoria
    x-runtipi:
      is_main: true
      internal_port: 8080
x-runtipi:
  schema_version: 2
