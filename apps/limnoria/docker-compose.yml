services:
  limnoria:
    image: linuxserver/limnoria:2026.5.8@sha256:9ff75185e9c38e214bac5b97994fec11b39d7d0d1096541399d0874c88c6c2ff
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 8080
        published: ${APP_PORT}
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/limnoria/config
        target: /config
    container_name: limnoria
    labels:
      runtipi.managed: "true"
    networks:
      - tipi_main_network
networks:
  tipi_main_network:
    external: true
