services:
  limnoria:
    image: linuxserver/limnoria:2026.5.8@sha256:4b6eae67efc3799d5467268fe86cf3964bc7175f2bb5bafffd8734564cd45565
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 8080
        published: ${APP_PORT}
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/limnoria/config
        target: /config
    container_name: limnoria
    labels:
      runtipi.managed: "true"
    networks:
      - tipi_main_network
networks:
  tipi_main_network:
    external: true
