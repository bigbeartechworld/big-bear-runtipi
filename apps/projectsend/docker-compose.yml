services:
  projectsend:
    image: linuxserver/projectsend:version-r2098@sha256:d43d209008c20dc17528c611efcdf82b911e972ce3c8b96527374ecc74a4c79e
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/projectsend/config
        target: /config
      - type: bind
        source: /DATA/AppData/projectsend/data
        target: /data
    container_name: projectsend
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
