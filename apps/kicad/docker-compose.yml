services:
  kicad:
    image: linuxserver/kicad:10.0.3@sha256:041619c60f795effe4b96c23788edcbd63fb12fad4b8267e6f06372671b99641
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/kicad/config
        target: /config
    container_name: kicad
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
