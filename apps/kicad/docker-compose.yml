services:
  kicad:
    image: linuxserver/kicad:10.0.3@sha256:de81f2b6188f41804c2409c580cfa7f7f4b05908e0c717cc4b66cf825609407c
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/kicad/config
        target: /config
    container_name: kicad
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
