services:
  kicad:
    image: linuxserver/kicad:10.0.3@sha256:27683df5f08133af07588900e1bd8440a9cc3c7e77a5bcfc6bab652f9b185665
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/kicad/config
        target: /config
    container_name: kicad
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
