services:
  yq:
    image: linuxserver/yq:4.4.0@sha256:459ea899679213d9aa951398a5461d61f24dcce7358ef02398e506a0884854ed
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/yq/config
        target: /config
    container_name: yq
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
