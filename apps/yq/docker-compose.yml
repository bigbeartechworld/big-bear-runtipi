services:
  yq:
    image: linuxserver/yq:4.4.0@sha256:f83757f22c2d330aa56ed1dfc93beb92b488ad2d0085aaa3dd076e6c12f9f260
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 80
        published: ${APP_PORT}
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/yq/config
        target: /config
    container_name: yq
    labels:
      runtipi.managed: "true"
    networks:
      - tipi_main_network
networks:
  tipi_main_network:
    external: true
