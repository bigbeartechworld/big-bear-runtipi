services:
  yq:
    image: linuxserver/yq:4.4.5@sha256:e25b0278a18ad74b869fcfe1395ca7a87b5038ff9c97c0f8f8bab3a5c5e8a2f4
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/yq/config
        target: /config
    container_name: yq
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
