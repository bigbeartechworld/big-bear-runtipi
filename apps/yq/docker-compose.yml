services:
  yq:
    image: linuxserver/yq:4.4.5@sha256:eee6452e10e8b990405e68d0c201c5bd6c688271af23a7789b66e514d3cb8fc4
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/yq/config
        target: /config
    container_name: yq
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
