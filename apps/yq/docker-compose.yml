services:
  yq:
    image: linuxserver/yq:4.4.2@sha256:a0e5f406011320cdeea8858a6c36cc56006651bdcf005d0d0ff2fdcd170ab872
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/yq/config
        target: /config
    container_name: yq
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
