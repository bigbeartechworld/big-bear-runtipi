services:
  nova-dso-tracker:
    image: mrantonsg/nova-dso-tracker:6.7.1@sha256:33b20216f6050c4dfbf6b933dc98e0c95f86c60b529189d394c8ef312da22052
    container_name: nova-dso-tracker
    ports:
      - "${APP_PORT}:5001"
    volumes:
      - ${APP_DATA_DIR}/instance:/app/instance
    restart: unless-stopped
    network_mode: bridge
    labels:
      runtipi.managed: "true"
    networks:
      - tipi_main_network
networks:
  tipi_main_network:
    external: true
