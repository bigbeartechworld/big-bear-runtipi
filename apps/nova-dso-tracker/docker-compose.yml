services:
  nova-dso-tracker:
    image: mrantonsg/nova-dso-tracker:6.5.0@sha256:a86ff7228310afd3446593d91a2d1e72506220e31041f1733b890b8e7d455872
    container_name: nova-dso-tracker
    ports:
      - "${APP_PORT}:5001"
    volumes:
      - ${APP_DATA_DIR}/instance:/app/instance
    restart: unless-stopped
    network_mode: bridge
    labels:
      runtipi.managed: "true"
    networks:
      - tipi_main_network
networks:
  tipi_main_network:
    external: true
