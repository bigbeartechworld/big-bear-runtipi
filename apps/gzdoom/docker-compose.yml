services:
  gzdoom:
    image: linuxserver/gzdoom:4.14.2@sha256:1af282b7d2cf2bfe27a030c4f2ba6142109a3a93db4bdd466fbbbddc3e8ef7fe
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/gzdoom/config
        target: /config
    container_name: gzdoom
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
