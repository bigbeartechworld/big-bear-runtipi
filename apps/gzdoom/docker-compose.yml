services:
  gzdoom:
    image: linuxserver/gzdoom:4.14.2@sha256:af1bb7dc68f7f4959f03feca7730265921713feff613d3dd4bdb7f4d5b44de64
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: ${APP_PORT}
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/gzdoom/config
        target: /config
    container_name: gzdoom
    labels:
      runtipi.managed: "true"
    networks:
      - tipi_main_network
networks:
  tipi_main_network:
    external: true
