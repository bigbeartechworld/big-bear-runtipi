services:
  gzdoom:
    image: linuxserver/gzdoom:4.14.2@sha256:9430ab9a5fe881498c3537c2a78ff403c3b0a8102f4a4d3af1985a97a92909c0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/gzdoom/config
        target: /config
    container_name: gzdoom
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
