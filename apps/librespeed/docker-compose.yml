services:
  librespeed:
    image: linuxserver/librespeed:6.3.0@sha256:05c1ca8215f958b674e8fa1c2ea43483efa54dae8f1dbe40c907af66821fdcae
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      PASSWORD: ''
      CUSTOM_RESULTS: ''
      DB_TYPE: ''
      DB_NAME: ''
      DB_HOSTNAME: ''
      DB_USERNAME: ''
      DB_PASSWORD: ''
      DB_PORT: ''
      IPINFO_APIKEY: ''
    volumes:
      - type: bind
        source: /DATA/AppData/librespeed/config
        target: /config
    container_name: librespeed
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
