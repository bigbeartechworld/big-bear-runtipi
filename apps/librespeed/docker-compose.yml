services:
  librespeed:
    image: linuxserver/librespeed:6.3.0@sha256:03380ad93dea90c672036851a2697666daa0a2e68558aa84b11a679946b57a7c
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      PASSWORD: ''
      CUSTOM_RESULTS: ''
      DB_TYPE: ''
      DB_NAME: ''
      DB_HOSTNAME: ''
      DB_USERNAME: ''
      DB_PASSWORD: ''
      DB_PORT: ''
      IPINFO_APIKEY: ''
    volumes:
      - type: bind
        source: /DATA/AppData/librespeed/config
        target: /config
    container_name: librespeed
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
