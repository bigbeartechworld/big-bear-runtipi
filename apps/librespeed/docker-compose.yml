services:
  librespeed:
    image: linuxserver/librespeed:6.3.1@sha256:0f85aac620b60a2566049f95d085fd2b044c720abfe88d1f1e14496ea0496833
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      PASSWORD: ''
      CUSTOM_RESULTS: ''
      DB_TYPE: ''
      DB_NAME: ''
      DB_HOSTNAME: ''
      DB_USERNAME: ''
      DB_PASSWORD: ''
      DB_PORT: ''
      IPINFO_APIKEY: ''
    volumes:
      - type: bind
        source: /DATA/AppData/librespeed/config
        target: /config
    container_name: librespeed
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
