# Configuration for ComposeToolbox setup

# Name of the big-bear-composetoolbox application
# Service definitions for the big-bear-composetoolbox application
services:
  composetoolbox:
    # Environment variables
    environment:
      # Node environment
      NODE_ENV: production
    # Image to be used for the container
    image: ghcr.io/bluegoosemedia/composetoolbox:latest@sha256:1cb6f19f3ea5ef08467870f542155619f9389bcf0dc68499e2c57a7c540f39b2
    pull_policy: always
    # Container restart policy
    restart: unless-stopped
    # Volumes to be mounted to the container
    volumes:
      - ${APP_DATA_DIR}/data:/app/data
    # Name of the container
    container_name: "composetoolbox"
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
