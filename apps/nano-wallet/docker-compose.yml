services:
  nano-wallet:
    image: linuxserver/nano-wallet:1.3.2@sha256:ad03cd3bcd43db7fd18bf15283c2c77550affc2650acd9c27d529e81bb6b703f
    restart: unless-stopped
    environment: {}
    ports:
      - target: 80
        published: ${APP_PORT}
        protocol: tcp
    container_name: nano-wallet
    labels:
      runtipi.managed: "true"
    networks:
      - tipi_main_network
networks:
  tipi_main_network:
    external: true
