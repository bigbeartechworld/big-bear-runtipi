services:
  synclounge:
    image: linuxserver/synclounge:5.2.35@sha256:f8a7bc27a1b90c2c02e4745f37c5d1bda7e04f45d5bb89f51e7b07cd8fe92e81
    restart: unless-stopped
    environment:
      AUTH_LIST: ''
    volumes:
      - type: bind
        source: /DATA/AppData/synclounge/config
        target: /config
    container_name: synclounge
    x-runtipi:
      is_main: true
      internal_port: 8088
x-runtipi:
  schema_version: 2
