# Configuration for nextcloud-ls setup

# Name of the big-bear-nextcloud-ls application
# Service definitions for the big-bear-nextcloud-ls application
services:
  nextcloud-ls:
    # Define the container name
    container_name: nextcloud-ls
    # Use the nextcloud:28.0.1-apache image
    image: linuxserver/nextcloud:35.0.1@sha256:e2d2b2bc261e6ac0652f544b4c3db60221f9e9f78b430dfcfea46529b7e97b5b
    # Restart the container unless stopped
    restart: unless-stopped
    # Map port 7580 on the host to port 80 on the container
    ports:
      - ${APP_PORT}:443
    # Mount the nextcloud-ls_data directory on the host to /var/www/html in the container
    volumes:
      - ${APP_DATA_DIR}/config:/config
      - ${APP_DATA_DIR}/data:/data
    # Set environment variables
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    labels:
      runtipi.managed: "true"
    networks:
      - tipi_main_network
networks:
  tipi_main_network:
    external: true
