services:
  budge:
    image: linuxserver/budge:0.0.9@sha256:efc0a9f474c380a1a141979bcd46c97c9e0435a94f60688d3b37bd85f4b732d3
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/budge/config
        target: /config
    container_name: budge
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
