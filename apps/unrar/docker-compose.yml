services:
  unrar:
    image: linuxserver/unrar:7.2.7@sha256:48c0ce2609bb3c35764956bbd9395e95b177421e3c74b3628c3676029f24f2e0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/unrar/config
        target: /config
    container_name: unrar
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
