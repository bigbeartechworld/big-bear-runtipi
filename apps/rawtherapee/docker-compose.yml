services:
  rawtherapee:
    image: linuxserver/rawtherapee:5.13.20260927@sha256:3cbe79409125024131a8875d7ab1bb63810daa9b294cd7fbb1511a70b3aade8e
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/rawtherapee/config
        target: /config
    container_name: rawtherapee
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
