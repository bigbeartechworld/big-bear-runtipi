services:
  rawtherapee:
    image: linuxserver/rawtherapee:5.13.20261025@sha256:6b2e857e1f273426a01146640c973be698ca9dd7088f61b3d54fe04fdb822d56
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/rawtherapee/config
        target: /config
    container_name: rawtherapee
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
