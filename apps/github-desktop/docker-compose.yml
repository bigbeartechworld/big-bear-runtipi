services:
  github-desktop:
    image: linuxserver/github-desktop:3.4.13@sha256:8651e12fa3c6418b3a6f1a745ec629e9923294c52a653a87d81983a4bbaeba07
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/github-desktop/config
        target: /config
    container_name: github-desktop
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
