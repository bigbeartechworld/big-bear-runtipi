services:
  keepassxc:
    image: linuxserver/keepassxc:2.7.12@sha256:d90c6897af7d11bc6f669e6a3ecee5a15a7e623d8a9d62411dbb83198ccf4081
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/keepassxc/config
        target: /config
    container_name: keepassxc
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
