services:
  keepassxc:
    image: linuxserver/keepassxc:2.7.12@sha256:3e559db94c85c7a5566e4f470345e347bc05b563844b0fc9185c7ecd5d219123
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/keepassxc/config
        target: /config
    container_name: keepassxc
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
