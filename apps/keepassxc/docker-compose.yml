services:
  keepassxc:
    image: linuxserver/keepassxc:2.7.12@sha256:267bc745b3cdd3d05276ad62c8e039031eec0c5d2323b3fb2f5f6df32110efdb
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/keepassxc/config
        target: /config
    container_name: keepassxc
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
