services:
  thelounge:
    image: linuxserver/thelounge:4.5.2@sha256:8793004304efb7744792c55911fc069495ecbc04c46e6054f06c12e7a44074e0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/thelounge/config
        target: /config
    container_name: thelounge
    x-runtipi:
      is_main: true
      internal_port: 9000
x-runtipi:
  schema_version: 2
