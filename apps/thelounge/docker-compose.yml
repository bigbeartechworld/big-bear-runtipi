services:
  thelounge:
    image: linuxserver/thelounge:4.5.2@sha256:552981ad86026e1f5fde3e378a7c8ffee653794b1333a791a23a74f2d54e31fc
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/thelounge/config
        target: /config
    container_name: thelounge
    x-runtipi:
      is_main: true
      internal_port: 9000
x-runtipi:
  schema_version: 2
