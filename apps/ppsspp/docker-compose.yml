services:
  ppsspp:
    image: linuxserver/ppsspp:1.20.4@sha256:a237f0248e5f20eb5d9f459bc9d88e354ad956779361cb21605fc5375a45bf65
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/ppsspp/config
        target: /config
    container_name: ppsspp
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
