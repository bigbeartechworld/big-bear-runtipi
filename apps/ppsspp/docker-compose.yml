services:
  ppsspp:
    image: linuxserver/ppsspp:1.20.4@sha256:5810e533a16da9a51c909c739672b0dc35bc9aef1773ebe408f85967226577ea
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/ppsspp/config
        target: /config
    container_name: ppsspp
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
