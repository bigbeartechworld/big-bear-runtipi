services:
  ppsspp:
    image: linuxserver/ppsspp:1.20.4@sha256:4703743dacda03d1f73ca54cf1903e83f0686981aa24498bf5cfacd4201e88d4
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/ppsspp/config
        target: /config
    container_name: ppsspp
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
