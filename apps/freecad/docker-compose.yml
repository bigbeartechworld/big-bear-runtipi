services:
  freecad:
    image: linuxserver/freecad:1.1.4@sha256:e84add50316b74fdc4e89c7da967a6eb0114257b710080864e3ba2c5adfe72c6
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/freecad/config
        target: /config
    container_name: freecad
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
