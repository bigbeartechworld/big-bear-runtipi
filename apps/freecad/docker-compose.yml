services:
  freecad:
    image: linuxserver/freecad:1.1.4@sha256:79e4344533aa28a03799cb1a36376f17ffee98c78890ef78d8297908eed301e8
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/freecad/config
        target: /config
    container_name: freecad
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
