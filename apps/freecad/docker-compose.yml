services:
  freecad:
    image: linuxserver/freecad:1.1.4@sha256:a2687a6e8b6dec94832aa4c6e4134aa01ccc3ad80588fd2005c3faba03829bb3
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/freecad/config
        target: /config
    container_name: freecad
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
