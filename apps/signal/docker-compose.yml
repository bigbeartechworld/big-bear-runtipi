services:
  signal:
    image: linuxserver/signal:8.31.0@sha256:8d6b41885d98a4752438de2bc42e229a0385809b3654e1d5a8c02065c9a7e9ae
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/signal/config
        target: /config
    container_name: signal
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
