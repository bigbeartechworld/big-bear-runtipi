services:
  signal:
    image: linuxserver/signal:8.30.0@sha256:c668a5ae3febc5c7b9b85183bd884ba0cfda0034b55a66fc92cab6ea0b347d56
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/signal/config
        target: /config
    container_name: signal
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
