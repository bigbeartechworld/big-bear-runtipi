services:
  signal:
    image: linuxserver/signal:8.32.0@sha256:d40ff7467fe5981498305b9e3d6e9c46d7963ce27dbe7a4ade664578f066c853
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/signal/config
        target: /config
    container_name: signal
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
