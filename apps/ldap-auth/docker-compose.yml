services:
  ldap-auth:
    image: linuxserver/ldap-auth:3.4.8@sha256:7afedf05b9c9033c96ac61ae0128edb6e36ab583a9f025e4a82d50e23a1bbe72
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      FERNETKEY: ''
      CERTFILE: ''
      KEYFILE: ''
    ports:
      - target: 8888
        published: ${APP_PORT}
        protocol: tcp
      - target: 9000
        published: 9000
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/ldap-auth/config
        target: /config
    container_name: ldap-auth
    labels:
      runtipi.managed: "true"
    networks:
      - tipi_main_network
networks:
  tipi_main_network:
    external: true
