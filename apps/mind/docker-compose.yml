# Configuration for big-bear-mind setup
# Service definitions for the big-bear-mind application
services:
  mind:
    image: "mrcas/mind:v1.5.2@sha256:b84f153ce9e57fe9172473252cb92ce1f2c4b70fa3fbd145402f89ee4491507e"
    container_name: mind
    environment:
      - TZ=UTC
    volumes:
      - "${APP_DATA_DIR}/db:/app/db"
    x-runtipi:
      is_main: true
      internal_port: 8080
x-runtipi:
  schema_version: 2
