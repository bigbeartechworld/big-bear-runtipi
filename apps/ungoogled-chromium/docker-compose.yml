services:
  ungoogled-chromium:
    image: linuxserver/ungoogled-chromium:156.0.8078@sha256:c2153c4f828f1290064a6461b4525ad5c9368a1d817779377a052c3f3fe19cc7
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      CHROME_CLI: ''
    volumes:
      - type: bind
        source: /DATA/AppData/ungoogled-chromium/config
        target: /config
    container_name: ungoogled-chromium
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
