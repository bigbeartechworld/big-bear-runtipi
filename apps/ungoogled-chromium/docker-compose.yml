services:
  ungoogled-chromium:
    image: linuxserver/ungoogled-chromium:155.0.8059@sha256:6a8446ff5728b32212e412d46c0981ac10b276c4a97222fa12d07352654ada28
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      CHROME_CLI: ''
    volumes:
      - type: bind
        source: /DATA/AppData/ungoogled-chromium/config
        target: /config
    container_name: ungoogled-chromium
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
