services:
  ungoogled-chromium:
    image: linuxserver/ungoogled-chromium:155.0.8059@sha256:fe12115faa4a65630a68789481b45f1a0daf1b0498f118580240b9048109ab4e
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      CHROME_CLI: ''
    volumes:
      - type: bind
        source: /DATA/AppData/ungoogled-chromium/config
        target: /config
    container_name: ungoogled-chromium
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
