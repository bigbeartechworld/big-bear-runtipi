services:
  gitqlient:
    image: linuxserver/gitqlient:1.6.3@sha256:5b0c580c1c772ce49b57d36c2800833215a21f3a79470179bb8480d62df74d73
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/gitqlient/config
        target: /config
    container_name: gitqlient
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
