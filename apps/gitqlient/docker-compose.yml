services:
  gitqlient:
    image: linuxserver/gitqlient:1.6.3@sha256:2c69326c880942f02218715daf495978b88be8da985da42998747b439c96d644
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/gitqlient/config
        target: /config
    container_name: gitqlient
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
