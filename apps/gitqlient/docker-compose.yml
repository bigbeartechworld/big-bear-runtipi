services:
  gitqlient:
    image: linuxserver/gitqlient:1.6.3@sha256:427de021755feacea9a1fe5b40fd8ebb13b2ac6283dc86afbbc40b1fbb2407bc
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/gitqlient/config
        target: /config
    container_name: gitqlient
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
