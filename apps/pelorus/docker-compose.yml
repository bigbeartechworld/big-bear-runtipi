services:
  pelorus:
    image: linuxserver/pelorus:0.2.3@sha256:0e54b78e4ffc371a3f8d353e8eb5cb5104e63db3f65616ca27d7914282e7f7e8
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/pelorus/config
        target: /config
    container_name: pelorus
    x-runtipi:
      is_main: true
      internal_port: 3001
x-runtipi:
  schema_version: 2
