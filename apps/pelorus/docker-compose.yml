services:
  pelorus:
    image: linuxserver/pelorus:0.2.3@sha256:f88bcea1363d012fe72e960a9359b2eacc8138feb6994530b24321a826dd0679
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/pelorus/config
        target: /config
    container_name: pelorus
    x-runtipi:
      is_main: true
      internal_port: 3001
x-runtipi:
  schema_version: 2
