services:
  pelorus:
    image: linuxserver/pelorus:0.2.3@sha256:363dca5d187580176cbbca6e0592d9aeaa674824d095850bac8dcb443ba11dc4
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3001
        published: ${APP_PORT}
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/pelorus/config
        target: /config
    container_name: pelorus
    labels:
      runtipi.managed: "true"
    networks:
      - tipi_main_network
networks:
  tipi_main_network:
    external: true
