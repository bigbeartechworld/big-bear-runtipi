services:
  pelorus:
    image: linuxserver/pelorus:0.2.3@sha256:4f08ca20c94f78f761e6a84d38534b55960289bf104c984d850f8a2b76569e74
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/pelorus/config
        target: /config
    container_name: pelorus
    x-runtipi:
      is_main: true
      internal_port: 3001
x-runtipi:
  schema_version: 2
