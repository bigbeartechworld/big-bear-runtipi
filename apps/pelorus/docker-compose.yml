services:
  pelorus:
    image: linuxserver/pelorus:0.2.4@sha256:b84198035870b61a5ef4b4a1e5e2babdd0d76910dc1951840a3e60d3668c0db7
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/pelorus/config
        target: /config
    container_name: pelorus
    x-runtipi:
      is_main: true
      internal_port: 3001
x-runtipi:
  schema_version: 2
