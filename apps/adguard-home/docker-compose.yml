# Configuration for adguard home setup

# Application Name
# Services used in the application
services:
  adguard-home:
    # Name of the container
    container_name: adguard-home
    # Docker image to be used
    image: adguard/adguardhome:v0.107.79@sha256:aba9e3bf0613be3ba3755e1fc311b126e2c24bec25e18b6483894a88283074f0
    # Resources for the service
    deploy:
      resources:
        reservations:
          memory: 64M
    # Volume mappings for the service
    volumes:
      - "${APP_DATA_DIR}/data/work:/opt/adguardhome/work" # Map data work directory
      - "${APP_DATA_DIR}/data/conf:/opt/adguardhome/conf" # Map configuration directory
    restart: unless-stopped
    ports: ["53:53/tcp", "53:53/udp"]
    # Define the networks
    networks:
      # Specify the adguard-home-network
      - adguard-home-network
    x-runtipi:
      is_main: true
      internal_port: 80
# Networks used by the application
networks:
  # Define the network for AdGuard Home
  adguard-home-network:
    driver: bridge
x-runtipi:
  schema_version: 2
