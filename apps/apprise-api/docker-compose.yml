services:
  apprise-api:
    image: linuxserver/apprise-api:2.0.1@sha256:110422ebb81151b6cfe1810ccb7529f353d9fa0fad7b9286fe59b67907a08368
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      APPRISE_ATTACH_SIZE: ''
    volumes:
      - type: bind
        source: /DATA/AppData/apprise-api/config
        target: /config
      - type: bind
        source: /DATA/AppData/apprise-api/attachments
        target: /attachments
    container_name: apprise-api
    x-runtipi:
      is_main: true
      internal_port: 8000
x-runtipi:
  schema_version: 2
