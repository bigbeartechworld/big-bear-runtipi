services:
  changedetection-io:
    image: linuxserver/changedetection.io:0.60.7@sha256:5a8cd61666feac9f91292e1f7a9dfa37f6e35674367b2e20252f9a126e2c8994
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      BASE_URL: ''
      PLAYWRIGHT_DRIVER_URL: ''
    ports:
      - target: 5000
        published: ${APP_PORT}
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/changedetection.io/config
        target: /config
    container_name: changedetection-io
    labels:
      runtipi.managed: "true"
    networks:
      - tipi_main_network
networks:
  tipi_main_network:
    external: true
