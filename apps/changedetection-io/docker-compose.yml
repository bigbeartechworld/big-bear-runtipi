services:
  changedetection-io:
    image: linuxserver/changedetection.io:0.60.9@sha256:bbdcedab4cc79d27d5fa4021cb6e9d1cf04cb711af53d291344fbaffe96adcd3
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      BASE_URL: ''
      PLAYWRIGHT_DRIVER_URL: ''
    volumes:
      - type: bind
        source: /DATA/AppData/changedetection.io/config
        target: /config
    container_name: changedetection-io
    x-runtipi:
      is_main: true
      internal_port: 5000
x-runtipi:
  schema_version: 2
