services:
  changedetection-io:
    image: linuxserver/changedetection.io:0.60.9@sha256:902d7df0205f5c92b6f18b3f56a99e24d451ec5803cd2b231bb292b77e074424
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      BASE_URL: ''
      PLAYWRIGHT_DRIVER_URL: ''
    volumes:
      - type: bind
        source: /DATA/AppData/changedetection.io/config
        target: /config
    container_name: changedetection-io
    x-runtipi:
      is_main: true
      internal_port: 5000
x-runtipi:
  schema_version: 2
