services:
  vivaldi:
    image: linuxserver/vivaldi:8.2.4133@sha256:ca3cc3e52b9a6bf26db6bea62536335328847302a6caba9b766b7c37b207a98d
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      VIVALDI_CLI: ''
    volumes:
      - type: bind
        source: /DATA/AppData/vivaldi/config
        target: /config
    container_name: vivaldi
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
