services:
  vivaldi:
    image: linuxserver/vivaldi:8.2.4133@sha256:66a85c75cb9709dde788b31ea2d64d48af052afb8cca28c5c4bd32bb5d845a59
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      VIVALDI_CLI: ''
    volumes:
      - type: bind
        source: /DATA/AppData/vivaldi/config
        target: /config
    container_name: vivaldi
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
