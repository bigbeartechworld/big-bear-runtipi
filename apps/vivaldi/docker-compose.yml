services:
  vivaldi:
    image: linuxserver/vivaldi:8.2.4133@sha256:6a0dfbac6b44dcf78cdb0c075286f8b93eeccb810a579c63150daa264096383d
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      VIVALDI_CLI: ''
    volumes:
      - type: bind
        source: /DATA/AppData/vivaldi/config
        target: /config
    container_name: vivaldi
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
