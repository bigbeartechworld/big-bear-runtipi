services:
  zen:
    image: linuxserver/zen:1.23.3@sha256:1b439526abf01d08b3c1803fe78aae9bbd4c81f8af4e1ef447b7a365a3ba23e7
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/zen/config
        target: /config
    container_name: zen
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
