services:
  zen:
    image: linuxserver/zen:1.23.1@sha256:7306e947e54169d4c7c9ba60322e5ed7cd43972acb948452eaa4765dc5d16fbb
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/zen/config
        target: /config
    container_name: zen
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
