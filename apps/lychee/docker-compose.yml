services:
  lychee:
    image: linuxserver/lychee:7.12.0@sha256:e5f34f152040a876e638b4e1a6ab1abb6bdb47984b9f87a37caa74b95e2f1645
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      DB_CONNECTION: $DB_CONNECTION
      DB_HOST: $DB_HOST
      DB_PORT: $DB_PORT
      DB_USERNAME: $DB_USERNAME
      DB_PASSWORD: $DB_PASSWORD
      DB_DATABASE: $DB_DATABASE
      APP_NAME: $APP_NAME
      APP_URL: $APP_URL
      TRUSTED_PROXIES: $TRUSTED_PROXIES
    volumes:
      - type: bind
        source: /DATA/AppData/lychee/config
        target: /config
      - type: bind
        source: /DATA/AppData/lychee/pictures
        target: /pictures
    container_name: lychee
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
