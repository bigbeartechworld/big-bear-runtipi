services:
  lychee:
    image: linuxserver/lychee:7.11.1@sha256:d4d81ebb5a1f00feb05813ec13c8edb24765b146965138e38f0f15d5c275a5b7
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      DB_CONNECTION: $DB_CONNECTION
      DB_HOST: $DB_HOST
      DB_PORT: $DB_PORT
      DB_USERNAME: $DB_USERNAME
      DB_PASSWORD: $DB_PASSWORD
      DB_DATABASE: $DB_DATABASE
      APP_NAME: $APP_NAME
      APP_URL: $APP_URL
      TRUSTED_PROXIES: $TRUSTED_PROXIES
    volumes:
      - type: bind
        source: /DATA/AppData/lychee/config
        target: /config
      - type: bind
        source: /DATA/AppData/lychee/pictures
        target: /pictures
    container_name: lychee
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
