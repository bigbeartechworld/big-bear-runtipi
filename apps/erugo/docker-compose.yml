# Configuration for erugo setup

# Name of the big-bear-erugo application
# Service definitions for the big-bear-erugo application
services:
  erugo:
    # Name of the container
    container_name: erugo
    # Image to be used for the container
    image: wardy784/erugo:0.2.15@sha256:0d9d31365e180408baee86172694a420418a7e05badd158fe84eb873a9f77753
    # Container restart policy
    restart: unless-stopped
    # Volumes to be mounted to the container
    volumes:
      # Mounting storage directory to allow erugo to save data
      - ${APP_DATA_DIR}/storage:/var/www/html/storage
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
