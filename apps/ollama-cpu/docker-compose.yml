# Configuration for ollama-cpu setup

# Name of the big-bear-ollama-cpu application
# Service definitions for the big-bear-ollama-cpu application
services:
  ollama-cpu:
    # Name of the container
    container_name: ollama-cpu
    # Image to be used for the container
    image: ollama/ollama:0.40.6@sha256:265409e1d931028a8f7d5a32bcbafddd7bffbc6cc629d77efe9560adf692a5e7
    # Container restart policy
    restart: unless-stopped
    # Environment variables
    environment:
      - PORT=11434
    # Volumes to be mounted to the container
    volumes:
      - ${APP_DATA_DIR}/.ollama:/root/.ollama
    devices:
      # Attach GPU
      - /dev/kfd
      - /dev/dri
    x-runtipi:
      is_main: true
      internal_port: 11434
x-runtipi:
  schema_version: 2
