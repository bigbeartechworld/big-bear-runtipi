services:
  grocy:
    image: linuxserver/grocy:4.7.1@sha256:d63bffe9afb2ef1a23fa7ce0749cdaeba9c169fb644b16eed270884a1b2f4ac9
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/grocy/config
        target: /config
    container_name: grocy
    x-runtipi:
      is_main: true
      internal_port: 9283
x-runtipi:
  schema_version: 2
