services:
  grocy:
    image: linuxserver/grocy:4.7.1@sha256:cae63f6c731f6ad8a3596eef097c136934a3a076e6ae533f933182187fe85a12
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/grocy/config
        target: /config
    container_name: grocy
    x-runtipi:
      is_main: true
      internal_port: 9283
x-runtipi:
  schema_version: 2
