services:
  grocy:
    image: linuxserver/grocy:4.7.1@sha256:1a8996206d1e0f5aa3aa85084dde2bae170a05b29b235de58c08b161873ce9a6
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/grocy/config
        target: /config
    container_name: grocy
    x-runtipi:
      is_main: true
      internal_port: 9283
x-runtipi:
  schema_version: 2
