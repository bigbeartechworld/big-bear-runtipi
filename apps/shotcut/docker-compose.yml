services:
  shotcut:
    image: linuxserver/shotcut:26.9.27@sha256:2b408ec9f1e32a4a73f85d7ecec618bd42f1d3dd610b69614c1b0b3346a8c789
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/shotcut/config
        target: /config
    container_name: shotcut
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
