services:
  shotcut:
    image: linuxserver/shotcut:26.9.27@sha256:d78247e48e8b4dab2c95c814bb4faaae38767018590d60f0d220326375ee1856
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/shotcut/config
        target: /config
    container_name: shotcut
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
