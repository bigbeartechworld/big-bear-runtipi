services:
  shotcut:
    image: linuxserver/shotcut:26.9.27@sha256:7cbfc1a31a0b6a302978bf4b8c5c55f602ac4ec130caa4b82479ccdf59517d14
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/shotcut/config
        target: /config
    container_name: shotcut
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
