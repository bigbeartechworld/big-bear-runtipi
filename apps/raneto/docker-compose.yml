services:
  raneto:
    image: linuxserver/raneto:0.18.1@sha256:cf9d477e458b039f121ae12bca48e1d00b7c9b45cd85e6b5ccc166cf5b3757f3
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/raneto/config
        target: /config
    container_name: raneto
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
