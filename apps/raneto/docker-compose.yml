services:
  raneto:
    image: linuxserver/raneto:0.18.1@sha256:a460ac8aa367ffe0f6af7474148eb66bd8bb08508b4c78a3d65b18f98b7670e4
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/raneto/config
        target: /config
    container_name: raneto
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
