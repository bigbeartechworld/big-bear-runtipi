services:
  kometa:
    image: linuxserver/kometa:2.5.3@sha256:a729f720e0964ad11f284bebeece84b5f302158b4ab242ded79f94df96e10e8f
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      KOMETA_CONFIG: ''
      KOMETA_TIMES: ''
      KOMETA_RUN: ''
      KOMETA_TESTS: ''
      KOMETA_NO_MISSING: ''
    volumes:
      - type: bind
        source: /DATA/AppData/kometa/config
        target: /config
    container_name: kometa
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
