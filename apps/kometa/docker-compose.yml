services:
  kometa:
    image: linuxserver/kometa:2.5.2@sha256:6cd9ebf316deecdd7d4dc6e339369f699f849749fdef9009bb51cdd882b0abe7
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      KOMETA_CONFIG: ''
      KOMETA_TIMES: ''
      KOMETA_RUN: ''
      KOMETA_TESTS: ''
      KOMETA_NO_MISSING: ''
    volumes:
      - type: bind
        source: /DATA/AppData/kometa/config
        target: /config
    container_name: kometa
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
