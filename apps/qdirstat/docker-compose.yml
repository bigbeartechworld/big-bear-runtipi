services:
  qdirstat:
    image: linuxserver/qdirstat:2.0.20261025@sha256:7909da908ad98d0f4fe807b28cee1cf07ddbc375980ce7907165e146f1d85415
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/qdirstat/config
        target: /config
      - type: bind
        source: /DATA/AppData/qdirstat/data
        target: /data
    container_name: qdirstat
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
