services:
  qdirstat:
    image: linuxserver/qdirstat:2.0.20261012@sha256:18b289a63ef1cf2ca088d6b887e894df627ed825a992851853edec92910f1078
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/qdirstat/config
        target: /config
      - type: bind
        source: /DATA/AppData/qdirstat/data
        target: /data
    container_name: qdirstat
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
