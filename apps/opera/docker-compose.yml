services:
  opera:
    image: linuxserver/opera:139.0.6053@sha256:7d6452db13b431ce1527a10f7418599f9aa4f179c3449299d0a9c220d3da7847
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      OPERA_CLI: ''
    volumes:
      - type: bind
        source: /DATA/AppData/opera/config
        target: /config
    container_name: opera
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
