services:
  opera:
    image: linuxserver/opera:138.0.6044@sha256:6afdd3f7e22f85578975af82cab4d230673d5c10e955a0ee8b003d2c01f46b55
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      OPERA_CLI: ''
    volumes:
      - type: bind
        source: /DATA/AppData/opera/config
        target: /config
    container_name: opera
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
