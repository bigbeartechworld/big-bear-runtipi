services:
  opera:
    image: linuxserver/opera:137.0.6036@sha256:bfa40165868ece5aa623ff8f17356004d6c5854a38fbc26bb49182f64db62505
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      OPERA_CLI: ''
    volumes:
      - type: bind
        source: /DATA/AppData/opera/config
        target: /config
    container_name: opera
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
