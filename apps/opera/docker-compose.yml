services:
  opera:
    image: linuxserver/opera:137.0.6036@sha256:ce7ec16ceeffbf94ab3446ad4b036ec285216d599fd01ed37483c53b2527a3eb
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      OPERA_CLI: ''
    volumes:
      - type: bind
        source: /DATA/AppData/opera/config
        target: /config
    container_name: opera
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
