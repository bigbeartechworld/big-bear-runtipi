services:
  opera:
    image: linuxserver/opera:139.0.6053@sha256:ef50f6482655e20209ae98f9345a33ccc65ac5268f389e2f5fbeea7afb5b7d88
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      OPERA_CLI: ''
    volumes:
      - type: bind
        source: /DATA/AppData/opera/config
        target: /config
    container_name: opera
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
