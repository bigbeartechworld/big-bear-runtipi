# Configuration for dbgate setup

# Name of the big-bear-dbgate application
# Service definitions for the big-bear-dbgate application
services:
  dbgate:
    # Name of the container
    container_name: dbgate
    # Image to be used for the container
    image: dbgate/dbgate:7.3.3-alpine@sha256:b4628b5788be63e49f6804c5d54d599d9b6cee713a630cbc841947166d3811e1
    # Container restart policy
    restart: unless-stopped
    # Volumes to be mounted to the container
    volumes:
      # Mounting the local homarr/configs directory to /app/data/configs inside the container
      - ${APP_DATA_DIR}/config:/root/.dbgate
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
