# Configuration for tailscale setup

# Name of the big-bear-tailscale application
# Service definitions for the big-bear-tailscale application
services:
  tailscale:
    # Name of the container
    container_name: tailscale
    # Image to be used for the container
    image: tailscale/tailscale:v1.104.2@sha256:b11583ad2e93e4671128538c88cf11f460444a5d7e449311dd1933a400ab849d
    # Container restart policy
    restart: unless-stopped
    # Environment variables for the container
    environment:
      - TS_SERVE_CONFIG=/config/serve-config.json
      - TS_ACCEPT_DNS=false
      - TS_AUTH_ONCE=false
      - TS_AUTHKEY=""
      - TS_HOSTNAME=""
      - TS_ROUTES=""
      - TS_EXTRA_ARGS=""
      - TS_USERSPACE=true
      - TS_STATE_DIR=/var/lib/tailscale
    # Volumes to be mounted to the container
    volumes:
      - ${APP_DATA_DIR}/state:/var/lib/tailscale
      - ${APP_DATA_DIR}/config:/config
      - ${APP_DATA_DIR}/shared:/shared
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
      - sys_module
    x-runtipi:
      is_main: true
      internal_port: 8080
x-runtipi:
  schema_version: 2
