services:
  digikam:
    image: linuxserver/digikam:9.1.0@sha256:b373c7756c283886a5027060de9aef0a6b5251a300038a5e88944c628200cfd5
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/digikam/config
        target: /config
    container_name: digikam
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
