services:
  digikam:
    image: linuxserver/digikam:9.1.0@sha256:23f15c1d6877533648896787ec4de437618e6d516cefd93ef56dfb6eec9b7edc
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/digikam/config
        target: /config
    container_name: digikam
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
