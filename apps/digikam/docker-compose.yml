services:
  digikam:
    image: linuxserver/digikam:9.1.0@sha256:f500bfbb0e77b04beb6d4f70369954cb7e72f4961b5500b3380d0456b7a308c3
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/digikam/config
        target: /config
    container_name: digikam
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
