services:
  helium:
    image: linuxserver/helium:0.19.4@sha256:2298ac3333f7591051f37576deef4d1e6393cca1dbab032f143642fa4831aeca
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      HELIUM_CLI: ''
    volumes:
      - type: bind
        source: /DATA/AppData/helium/config
        target: /config
    container_name: helium
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
