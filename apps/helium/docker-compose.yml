services:
  helium:
    image: linuxserver/helium:0.20.1@sha256:e1485c3408f3d41c0169eaf7f61762b238f466b64682fd5a9c071b477ccd6680
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      HELIUM_CLI: ''
    volumes:
      - type: bind
        source: /DATA/AppData/helium/config
        target: /config
    container_name: helium
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
