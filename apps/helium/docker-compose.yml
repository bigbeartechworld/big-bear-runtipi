services:
  helium:
    image: linuxserver/helium:0.19.3@sha256:c05010766b1d5182f1b9b2e18ce3aa5a1b03cf3bdda7f043d641e5ada2b5e9ea
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      HELIUM_CLI: ''
    volumes:
      - type: bind
        source: /DATA/AppData/helium/config
        target: /config
    container_name: helium
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
