# Configuration for dockpeek setup

# Name of the big-bear-dockpeek application
# Service definitions for the big-bear-dockpeek application
services:
  dockpeek:
    # Name of the container
    container_name: dockpeek
    # Image to be used for the container
    image: ghcr.io/dockpeek/dockpeek:v1.7.2@sha256:87654d0104eacff48a70c7c1eea6126f19f5803b21bfdace842ae765351593b4
    # Environment variables
    environment:
      # Secret key for the application (change this)
      SECRET_KEY: "change_this_secret_key"
      # Username for authentication (change this)
      USERNAME: "bigbear"
      # Password for authentication (change this)
      PASSWORD: "casaos"
      # Docker host configuration
      DOCKER_HOST: "unix:///var/run/docker.sock"
    # Container restart policy
    restart: unless-stopped
    # Volumes to be mounted to the container
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    x-runtipi:
      is_main: true
      internal_port: 8000
x-runtipi:
  schema_version: 2
