# Configuration for appsmith setup

# Name of the big-bear-appsmith application
# Service definitions for the big-bear-appsmith application
services:
  appsmith:
    image: appsmith/appsmith-ce:v2.4.1@sha256:a27b379893ec569b5a2dcced813016ed29d84209e5f8a35be257067b657f32fe # Docker image to use
    container_name: appsmith # Name of the container
    ports:
      - "${APP_PORT}:80" # Port mapping host:container for HTTP
      - "10443:443" # Port mapping host:container for HTTPS
    volumes:
      - ${APP_DATA_DIR}/stacks:/appsmith-stacks # Mount volume for app data
    restart: unless-stopped # Container restart policy
    labels:
      runtipi.managed: "true"
    networks:
      - tipi_main_network
networks:
  tipi_main_network:
    external: true
