services:
  ddclient:
    image: linuxserver/ddclient:4.0.0@sha256:974d9aab3f1eb9944e88f4f461b5b4372a455132c7955a4977dff67a91a914fb
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/ddclient/config
        target: /config
    container_name: ddclient
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
