services:
  ddclient:
    image: linuxserver/ddclient:4.0.0@sha256:b1908f320d88bba7872301c048c8119188e5be508dab2dfa97171f98c1078603
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/ddclient/config
        target: /config
    container_name: ddclient
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
