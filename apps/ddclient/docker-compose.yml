services:
  ddclient:
    image: linuxserver/ddclient:4.0.0@sha256:f94b9a1c19a34e3b5500cfbfbfdee1fed7e6636fbbf7519519b0e92424223f11
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/ddclient/config
        target: /config
    container_name: ddclient
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
