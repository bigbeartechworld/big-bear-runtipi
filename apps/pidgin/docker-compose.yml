services:
  pidgin:
    image: linuxserver/pidgin:2.14.14@sha256:12c0f4103b37b53b4e84e3c5b7cea10992ff16e6f103c652d8eedfae11ba15a4
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/pidgin/config
        target: /config
    container_name: pidgin
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
