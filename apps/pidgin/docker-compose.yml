services:
  pidgin:
    image: linuxserver/pidgin:2.14.14@sha256:33d0103c4061bcd7636dc513f6222a69640e56416f5ff6e459e6c7b6ca77db1a
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/pidgin/config
        target: /config
    container_name: pidgin
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
