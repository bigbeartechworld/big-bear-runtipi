services:
  pidgin:
    image: linuxserver/pidgin:2.14.14@sha256:9ee6ed078cb63c60d2c2a7a5df485f7e3a04384e7f7e529c8ac5fd41cf7747c6
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/pidgin/config
        target: /config
    container_name: pidgin
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
