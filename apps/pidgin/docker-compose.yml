services:
  pidgin:
    image: linuxserver/pidgin:2.14.14@sha256:23b740efcbe804d544a3cb8affc6b1fdbc9151871297cd71a8db45870c9dd3bc
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/pidgin/config
        target: /config
    container_name: pidgin
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
