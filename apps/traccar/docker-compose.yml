# Configuration for traccar setup

# Name of the big-bear-traccar application
# Service definitions for the big-bear-traccar application
services:
  traccar:
    image: traccar/traccar:6.16-ubuntu@sha256:fd903e34d41209a3890812cb868799dc893e71aee0cce3d51947ab6e44ace887 # Specifies the docker image to use for this service. Using the latest version of the traccar image.
    container_name: traccar # Name of the container that will be created
    hostname: traccar # Hostname of the container
    restart: unless-stopped # Restart policy. The container will restart unless it's explicitly stopped.
    ports: ["5000-5150:5000-5150", "5000-5150:5000-5150/udp"]
    volumes: # Defines volume mounts for the container
      - "${APP_DATA_DIR}/logs:/opt/traccar/logs:rw" # Mounts the logs directory from the host to the container with read and write permissions
      - "${APP_DATA_DIR}/traccar.xml:/opt/traccar/conf/traccar.xml:ro" # Mounts the traccar.xml config file from the host to the container with read-only permissions
    x-runtipi:
      is_main: true
      internal_port: 8082
x-runtipi:
  schema_version: 2
