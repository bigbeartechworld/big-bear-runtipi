    image: linuxserver/endlessh:version-dfe44eb2@sha256:1ba907783c782f2900347a42d730d97ccc88ab50e9c3403657211ca711d02ecc
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      MSDELAY: ''
      MAXLINES: ''
      MAXCLIENTS: ''
      LOGFILE: ''
      BINDFAMILY: ''
    volumes:
      - type: bind
        source: /DATA/AppData/endlessh/config
        target: /config
      - type: bind
        source: /DATA/AppData/endlessh/config
        target: /config
    container_name: endlessh
    x-runtipi:
      is_main: true
      internal_port: 22
x-runtipi:
  schema_version: 2
