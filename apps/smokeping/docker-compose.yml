services:
  smokeping:
    image: linuxserver/smokeping:2.9.0@sha256:41ad1006ee392f6045ec24a0a8127a880bb95dc7bde1a5b3a381c16c0b41a9d9
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      MASTER_URL: ''
      SHARED_SECRET: ''
      CACHE_DIR: ''
    volumes:
      - type: bind
        source: /DATA/AppData/smokeping/config
        target: /config
      - type: bind
        source: /DATA/AppData/smokeping/data
        target: /data
    container_name: smokeping
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
