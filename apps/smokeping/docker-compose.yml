services:
  smokeping:
    image: linuxserver/smokeping:2.9.0@sha256:6861c15df8151c454ed09da610b64c86bc274748e664f53f3e15ec1a3cd45431
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      MASTER_URL: ''
      SHARED_SECRET: ''
      CACHE_DIR: ''
    volumes:
      - type: bind
        source: /DATA/AppData/smokeping/config
        target: /config
      - type: bind
        source: /DATA/AppData/smokeping/data
        target: /data
    container_name: smokeping
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
