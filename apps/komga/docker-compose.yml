# Configuration for komga setup

# Name of the big-bear-komga application
# Service definitions for the big-bear-komga application
services:
  komga:
    # Name of the container
    container_name: komga
    # Image to be used for the container
    image: ghcr.io/gotson/komga:1.24.4@sha256:dae630271561b642d47c9723803ec77900d1f0a803fbe6a42da69db5b21ebaeb
    # Container restart policy
    restart: unless-stopped
    # Environment variables for the container
    environment:
      - TZ=UTC
    # Volumes to be mounted to the container
    volumes:
      - ${APP_DATA_DIR}/config:/config
      - ${APP_DATA_DIR}/data:/data
    x-runtipi:
      is_main: true
      internal_port: 25600
x-runtipi:
  schema_version: 2
