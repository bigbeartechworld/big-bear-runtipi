services:
  ngircd:
    image: linuxserver/ngircd:version-27-r1@sha256:a45daaa107b7c5d6d9d39011758f73f97cc104f377694bd6cdad308718794fab
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/ngircd/config
        target: /config
    container_name: ngircd
    x-runtipi:
      is_main: true
      internal_port: 6667
x-runtipi:
  schema_version: 2
