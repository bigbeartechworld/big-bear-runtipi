services:
  ffmpeg:
    image: linuxserver/ffmpeg:9.0.2@sha256:f4191c1abe18d75c49a23f7224d1403d55334f80013a47cb096f5056cf19617b
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/ffmpeg/config
        target: /config
    container_name: ffmpeg
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
