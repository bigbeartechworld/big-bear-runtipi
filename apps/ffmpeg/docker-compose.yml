services:
  ffmpeg:
    image: linuxserver/ffmpeg:9.0.2@sha256:6547359fac23a2747e606d380e10267b2923a38f68485d9cacefd039e74d3aa8
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/ffmpeg/config
        target: /config
    container_name: ffmpeg
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
