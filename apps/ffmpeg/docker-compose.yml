services:
  ffmpeg:
    image: linuxserver/ffmpeg:9.0.2@sha256:abb675ffda7047f42dfba02adcd0886b3abfca6dec332adc4da831de943989ed
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/ffmpeg/config
        target: /config
    container_name: ffmpeg
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
