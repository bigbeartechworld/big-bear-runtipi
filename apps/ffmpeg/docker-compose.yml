services:
  ffmpeg:
    image: linuxserver/ffmpeg:9.0.2@sha256:742e17516dd4d7b76b939d774bd08f0f6b7cab8bce1c014b95ab2fb992fd0a1f
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/ffmpeg/config
        target: /config
    container_name: ffmpeg
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
