services:
  socket-proxy:
    image: linuxserver/socket-proxy:3.4.7@sha256:e5d819de59b343c01b2fe7adc7fad3c7a60e5dba08e45f1ac317352bc08599b5
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/socket-proxy/config
        target: /config
    container_name: socket-proxy
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
