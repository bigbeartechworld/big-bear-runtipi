# Configuration for unifi-network-application setup

# Name of the big-bear-unifi-network-application application
# Service definitions for the big-bear-homarr application
services:
  # MongoDB database for the application
  unifi-db:
    image: mongo:6.0.11@sha256:52a007213974cab7753e9cd3fbd5750cc9a9f996f85ccdae73b164239b8f6951
    container_name: big-bear-unifi-db
    volumes:
      - ${APP_DATA_DIR}/db/data:/data/db # MongoDB data persistence
      - ${APP_DATA_DIR}/db/init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks: # Networks to join
      - unifi-nework-application-network
    restart: unless-stopped # Restart policy
  unifi-network-application:
    image: linuxserver/unifi-network-application:10.6.106@sha256:4d5fc889c2f2c2cecc6b35d4d641780cbedbe90d3a51b8f03283261b137af468 # Docker image to use
    container_name: unifi-network-application # Name for the created container
    environment: # Environmental variables for the container
      - PUID=1000 # User ID
      - PGID=1000 # Group ID
      - TZ=Etc/UTC # Timezone
      - MONGO_HOST=big-bear-unifi-db # MongoDB host
      - MONGO_USER=unifi # MongoDB username
      - MONGO_PASS=unifi_password # MongoDB password
      - MONGO_PORT=27017 # MongoDB port
      - MONGO_DBNAME=unifi # MongoDB database name
      - MEM_LIMIT=1024 #optional  # Memory limit for the container
      - MEM_STARTUP=1024 #optional  # Memory to allocate on container startup
      - MONGO_TLS= #optional  # MongoDB TLS setting
      - MONGO_AUTHSOURCE= #optional  # MongoDB authentication source
    volumes: # Volumes to mount in the container
      - ${APP_DATA_DIR}/config:/config # Map host directory to container directory
    ports: ["3478:3478/udp", "10001:10001/udp", "8080:8080", "1900:1900/udp", "6789:6789", "5514:5514/udp"]
    restart: unless-stopped # Restart policy for the container
    networks: # Networks to join
      - unifi-nework-application-network
    depends_on:
      - unifi-db
    x-runtipi:
      is_main: true
      internal_port: 8443
# Networks used by the application
networks:
  # Define the network for AdGuard Home
  unifi-nework-application-network:
    driver: bridge
x-runtipi:
  schema_version: 2
