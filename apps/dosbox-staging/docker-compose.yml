services:
  dosbox-staging:
    image: linuxserver/dosbox-staging:0.83.0@sha256:ed0fb191ed151d7977bd140ea1270ff309cebe326bcbf0d04171c6c7723f004c
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/dosbox-staging/config
        target: /config
    container_name: dosbox-staging
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
