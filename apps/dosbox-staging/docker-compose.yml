services:
  dosbox-staging:
    image: linuxserver/dosbox-staging:0.83.0@sha256:49d643baf92fae352a6f12d3ec148b647cde34fe3e6f6293b5ff97d23790a3e0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: ${APP_PORT}
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/dosbox-staging/config
        target: /config
    container_name: dosbox-staging
    labels:
      runtipi.managed: "true"
    networks:
      - tipi_main_network
networks:
  tipi_main_network:
    external: true
