services:
  dosbox-staging:
    image: linuxserver/dosbox-staging:0.83.0@sha256:e3846c5d036f8d26e3cf73137a0469f923561980e5a8c4f7f22c17306d1c9288
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/dosbox-staging/config
        target: /config
    container_name: dosbox-staging
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
