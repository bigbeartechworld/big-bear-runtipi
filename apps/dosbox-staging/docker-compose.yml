services:
  dosbox-staging:
    image: linuxserver/dosbox-staging:0.83.0@sha256:0bfe4890e61b5af9a7edd257e83dedb85b6c1f477ad9786be3e2adbe1aef436b
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/dosbox-staging/config
        target: /config
    container_name: dosbox-staging
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
