services:
  telegram:
    image: linuxserver/telegram:7.3.1@sha256:6066363938bcd953a63985fc787949f274a1a0a3e885ef7a44d526bd81892e91
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/telegram/config
        target: /config
    container_name: telegram
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
