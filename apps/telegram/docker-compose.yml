services:
  telegram:
    image: linuxserver/telegram:7.3.2@sha256:e0acac08866ee19cfc46840083fd75c5aefd19559126182c9c27702dfe66d205
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/telegram/config
        target: /config
    container_name: telegram
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
