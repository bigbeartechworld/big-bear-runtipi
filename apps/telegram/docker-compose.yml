services:
  telegram:
    image: linuxserver/telegram:7.3.1@sha256:1f3105935e94cf226b58706d6dff51245c2019895c2ccb209cc30dc0b2855a32
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/telegram/config
        target: /config
    container_name: telegram
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
