services:
  lm-studio:
    image: linuxserver/lm-studio:version-2026-09-12@sha256:29d2149a8046d54be16a9a3ae60568f63e6e886bed453d5884f8cfa93a3ac389
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/lm-studio/config
        target: /config
    container_name: lm-studio
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
