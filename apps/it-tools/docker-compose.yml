# Configuration for it-tools setup

# Name of the big-bear-it-tools application
# Service definitions for the big-bear-it-tools application
services:
  it-tools:
    # Name of the container
    container_name: it-tools
    # Image to be used for the container
    image: corentinth/it-tools:2023.11.2-7d94e11@sha256:30b032f2175e9c4dc5c795cfa44354ce7fe76d9768caee0f24a9a7371948ac0d
    # Container restart policy
    restart: unless-stopped
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
