# Configuration for big-bear-portainer setup
# Service definitions for the big-bear-portainer application
services:
  portainer:
    container_name: portainer # Name of the running container
    image: portainer/portainer-ce:2.45.3-alpine@sha256:3d2e116d0aab38f13ee2b893e4fd931e69a09574eee0b597711a68d76754cce1 # Image to be used
    ports: ["8000:8000"]
    volumes: # Port mapping between host and container
      - ${APP_DATA_DIR}/data:/data # Bind mount for Docker volumes
      - /var/run/docker.sock:/var/run/docker.sock # Bind mount for Docker socket
    x-runtipi:
      is_main: true
      internal_port: 9443
x-runtipi:
  schema_version: 2
