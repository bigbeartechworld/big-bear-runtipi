# Configuration for OpenVPN-AS setup

# Name of the OpenVPN-AS application
# Service definitions for the OpenVPN application
services:
  openvpn-as:
    # Name of the container
    container_name: openvpn-as
    # Image to be used for the container
    image: openvpn/openvpn-as:2.13.1-d8cdeb9c-Ubuntu22@sha256:609aa2238acef1cb3b277c1e7f293e21da1033fb2eb1b52f51e8b22d6ee7227c
    # Container restart policy
    restart: unless-stopped
    # Privileged mode for the container
    privileged: true
    # Capabilities to be added to the container
    cap_add:
      - NET_ADMIN
    # Environment variables for the container
    environment:
      - PGID=1000
      - PUID=1000
      # Timezone for the container
      - TZ=Europe/Rome
    # Hostname for the container
    hostname: OpenVPN
    # Labels for the container
    labels:
      icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/openvpn.png
    # Ports to be exposed by the container
    ports: ["443:443/tcp", "1194:1194/udp"]
    # Volumes to be mounted to the container
    volumes:
      # Mounting the local OpenVPN/data directory to /openvpn inside the container
      - ${APP_DATA_DIR}/data:/openvpn
    x-runtipi:
      is_main: true
      internal_port: 943
x-runtipi:
  schema_version: 2
