services:
  hbbr:
    image: rustdesk/rustdesk-server:1
    command: hbbr
    volumes:
      - /DATA/AppData/rustdesk/data:/root
    network_mode: host
    restart: unless-stopped
    labels:
      runtipi.managed: "true"
    networks:
      - tipi_main_network
  rustdesk-server:
    image: rustdesk/rustdesk-server:1
    command: rustdesk-server
    volumes:
      - /DATA/AppData/rustdesk/data:/root
    network_mode: host
    depends_on:
      - hbbr
    restart: unless-stopped
    container_name: rustdesk-server
    labels:
      runtipi.managed: "true"
    networks:
      - tipi_main_network
networks:
  tipi_main_network:
    external: true
