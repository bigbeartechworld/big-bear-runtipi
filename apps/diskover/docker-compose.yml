services:
  diskover:
    image: linuxserver/diskover:2.3.5@sha256:f352b7726ef85b1ea8e157d99f42c9abeed9e2e547b46ebeae19e2a7110fd8a4
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      ES_HOST: ''
      ES_PORT: ''
    volumes:
      - type: bind
        source: /DATA/AppData/diskover/config
        target: /config
      - type: bind
        source: /DATA/AppData/diskover/data
        target: /data
    container_name: diskover
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
