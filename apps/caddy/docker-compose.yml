services:
  caddy:
    image: caddy:2.11.7
    restart: unless-stopped
    volumes:
      - type: bind
        source: /DATA/AppData/caddy/data
        target: /data
      - type: bind
        source: /DATA/AppData/caddy/config
        target: /config
      - type: bind
        source: /DATA/AppData/caddy/caddyfile
        target: /etc/caddy/caddyfile
    container_name: caddy
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
