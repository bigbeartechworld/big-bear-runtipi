services:
  blender:
    image: linuxserver/blender:5.2.2@sha256:d66c5758fb64316bcc88a3e779b2d544df5c1d8c320f8003444994906657f230
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/blender/config
        target: /config
    container_name: blender
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
