services:
  blender:
    image: linuxserver/blender:5.2.2@sha256:4506052a10e9715d620dce8abe630342a54c23822d85086d90225f6973ab4650
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/blender/config
        target: /config
    container_name: blender
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
