services:
  blender:
    image: linuxserver/blender:5.2.3@sha256:866069a7ea0600f80bad6f4050e9933cb3eb886b0a87ea1fa890fe5167ab0fd6
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/blender/config
        target: /config
    container_name: blender
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
