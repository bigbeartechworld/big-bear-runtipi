services:
  blender:
    image: linuxserver/blender:5.2.3@sha256:e5f3ea336c1ca21bc6c37045c19b10d95f3cba27fc21b85221ea1beefcfd0328
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/blender/config
        target: /config
    container_name: blender
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
