services:
  hishtory-server:
    image: linuxserver/hishtory-server:0.335.20261009@sha256:2b2e29e5f616b7585f18a5077612d1f0d2416e58d6811b8f001e6e9f606219a7
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      HISHTORY_POSTGRES_DB: ''
      HISHTORY_SQLITE_DB: ''
    volumes:
      - type: bind
        source: /DATA/AppData/hishtory-server/config
        target: /config
    container_name: hishtory-server
    x-runtipi:
      is_main: true
      internal_port: 8080
x-runtipi:
  schema_version: 2
