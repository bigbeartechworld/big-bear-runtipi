services:
  hishtory-server:
    image: linuxserver/hishtory-server:0.335.20261016@sha256:5cbf3c91579b4fe0fd1ae347e5855301972692d4de6a7231942315b76fe05617
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      HISHTORY_POSTGRES_DB: ''
      HISHTORY_SQLITE_DB: ''
    volumes:
      - type: bind
        source: /DATA/AppData/hishtory-server/config
        target: /config
    container_name: hishtory-server
    x-runtipi:
      is_main: true
      internal_port: 8080
x-runtipi:
  schema_version: 2
