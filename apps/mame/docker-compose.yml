services:
  mame:
    image: linuxserver/mame:version-0.289dfsg1-0@sha256:9f1016638565fcb920a1849344518b5d594ee55b19b9e9e2875d06606ec3dcc8
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/mame/config
        target: /config
      - type: bind
        source: /DATA/AppData/mame/mame:ro
        target: /mame:ro
    container_name: mame
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
