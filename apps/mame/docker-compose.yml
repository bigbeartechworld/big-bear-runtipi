services:
  mame:
    image: linuxserver/mame:version-0.289dfsg1-0@sha256:5de23ce5dcd522563b73c7506a5b21dd438a3a544c5f94847207f55f3894cf9b
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/mame/config
        target: /config
      - type: bind
        source: /DATA/AppData/mame/mame:ro
        target: /mame:ro
    container_name: mame
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
