services:
  mame:
    image: linuxserver/mame:version-0.289dfsg1-0@sha256:347d5184b480017de07cb984100d34e924b364cf0b8b03121df7a5bd8894e4ec
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/mame/config
        target: /config
      - type: bind
        source: /DATA/AppData/mame/mame:ro
        target: /mame:ro
    container_name: mame
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
