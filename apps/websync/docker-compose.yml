services:
  websync:
    image: furier/websync:latest
    restart: unless-stopped
    working_dir: /src
    command:
      - node
      - server.js
    volumes:
      - type: bind
        source: /DATA/AppData/websync/data
        target: /data
    container_name: websync
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
