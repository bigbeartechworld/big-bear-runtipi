services:
  webstation:
    image: linuxserver/webstation:0.15.3-romm@sha256:eec9b7bb0571da05534daa08edde5ccf0e212a635794f29ea5f39f1c70a7ffb5
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/webstation/config
        target: /config
    container_name: webstation
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
