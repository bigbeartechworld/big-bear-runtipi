services:
  webstation:
    image: linuxserver/webstation:0.15.1-romm@sha256:696dd0fea59f808b2ff160957118cb7247ab95823d2448f7fe46b3fe726d1a03
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/webstation/config
        target: /config
    container_name: webstation
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
