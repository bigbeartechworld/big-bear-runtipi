services:
  webstation:
    image: linuxserver/webstation:0.15.2-romm@sha256:14e57bca54910a6e8b0b808962497aeef0bb48e2a444a7a556a0667b40111081
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/webstation/config
        target: /config
    container_name: webstation
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
