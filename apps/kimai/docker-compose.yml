services:
  kimai:
    image: linuxserver/kimai:2.69.0@sha256:02a9646e0ba5bcfd0da0f4580c718787951582eb73325c749c6333d6ed87e26e
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      APP_SECRET: ''
      DATABASE_URL: ''
      TRUSTED_HOSTS: ''
      TRUSTED_PROXIES: ''
    volumes:
      - type: bind
        source: /DATA/AppData/kimai/config
        target: /config
    container_name: kimai
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
