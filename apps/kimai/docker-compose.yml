services:
  kimai:
    image: linuxserver/kimai:2.71.0@sha256:69330bf42a65e17648b494e7f4c2751c4e1deb4039fa5476595aaf6b8fbf2e2e
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      APP_SECRET: ''
      DATABASE_URL: ''
      TRUSTED_HOSTS: ''
      TRUSTED_PROXIES: ''
    volumes:
      - type: bind
        source: /DATA/AppData/kimai/config
        target: /config
    container_name: kimai
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
