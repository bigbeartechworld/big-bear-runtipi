services:
  kimai:
    image: linuxserver/kimai:2.70.0@sha256:93348c63012d0a1dad18d44915aa8efafc8068c5a53c7c6900c76b8ff43680f2
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      APP_SECRET: ''
      DATABASE_URL: ''
      TRUSTED_HOSTS: ''
      TRUSTED_PROXIES: ''
    volumes:
      - type: bind
        source: /DATA/AppData/kimai/config
        target: /config
    container_name: kimai
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
