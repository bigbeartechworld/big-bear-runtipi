services:
  kimai:
    image: linuxserver/kimai:2.69.0@sha256:78d1537658de5b47b6d9663ec6eeded539376c5187d51d298331f4474df7ab45
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      APP_SECRET: ''
      DATABASE_URL: ''
      TRUSTED_HOSTS: ''
      TRUSTED_PROXIES: ''
    volumes:
      - type: bind
        source: /DATA/AppData/kimai/config
        target: /config
    container_name: kimai
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
