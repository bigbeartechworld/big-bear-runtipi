services:
  sealskin:
    image: linuxserver/sealskin:0.3.2@sha256:3053dc71f8a5ee948ceaa912f4d8528be63ab4df0cba4653b688d35b904bf6fd
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      HOST_URL: ''
    volumes:
      - type: bind
        source: /DATA/AppData/sealskin/config
        target: /config
      - type: bind
        source: /DATA/AppData/sealskin/storage
        target: /storage
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
    container_name: sealskin
    x-runtipi:
      is_main: true
      internal_port: 8443
x-runtipi:
  schema_version: 2
