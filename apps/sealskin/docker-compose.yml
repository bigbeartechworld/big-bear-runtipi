services:
  sealskin:
    image: linuxserver/sealskin:0.4.0@sha256:715433f44c6265b4402061e0dd6767610accb7c44b2c6ce91ec8fc77e392283a
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      HOST_URL: ''
    volumes:
      - type: bind
        source: /DATA/AppData/sealskin/config
        target: /config
      - type: bind
        source: /DATA/AppData/sealskin/storage
        target: /storage
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
    container_name: sealskin
    x-runtipi:
      is_main: true
      internal_port: 8443
x-runtipi:
  schema_version: 2
