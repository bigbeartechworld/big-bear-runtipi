services:
  libreoffice:
    image: linuxserver/libreoffice:25.8.7@sha256:cf7f029fd003d6111afeb27be62fd6c869de79d417531d9e90a77ff647730b02
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/libreoffice/config
        target: /config
    container_name: libreoffice
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
