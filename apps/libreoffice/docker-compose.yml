services:
  libreoffice:
    image: linuxserver/libreoffice:25.8.7@sha256:8604108b23c587db134de97f03c7117e62f341de89792f480ebd1858bc5a93bd
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/libreoffice/config
        target: /config
    container_name: libreoffice
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
