services:
  filezilla:
    image: linuxserver/filezilla:3.69.6@sha256:5fd56fe75c3bd14b111c42a7286e954381aac9b485b097aae2e0d1d19eb89e68
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/filezilla/config
        target: /config
    container_name: filezilla
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
