services:
  filezilla:
    image: linuxserver/filezilla:3.69.6@sha256:a22863a26e29b566fa6bc883bc5cfda9074f6b4a0b42588045f1f40c57aa3e49
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/filezilla/config
        target: /config
    container_name: filezilla
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
