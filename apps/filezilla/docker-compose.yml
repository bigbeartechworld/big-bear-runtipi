services:
  filezilla:
    image: linuxserver/filezilla:3.69.6@sha256:dafcfbccf25ce88af5d29bf3bbb3bfbf1f5dc6ef5ef0863b7427ca01511c79fe
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/filezilla/config
        target: /config
    container_name: filezilla
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
