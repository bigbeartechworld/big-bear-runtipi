services:
  retroarch:
    image: linuxserver/retroarch:1.22.2@sha256:a21cb9131f7fd25af0ee42e8efc1a468a1c57edbe65a32db530c082c59e1d82c
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/retroarch/config
        target: /config
    container_name: retroarch
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
