services:
  retroarch:
    image: linuxserver/retroarch:1.22.2@sha256:f148c679b390305b598b2175d9ec7654700ac148ba5773a363b84c5c792ae5e5
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/retroarch/config
        target: /config
    container_name: retroarch
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
