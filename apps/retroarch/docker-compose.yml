services:
  retroarch:
    image: linuxserver/retroarch:1.22.2@sha256:3f842a3bb9a90b78197be2e9a952c3a6a5df3297b6a3152c4c633ee06fa7f21a
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/retroarch/config
        target: /config
    container_name: retroarch
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
