services:
  retroarch:
    image: linuxserver/retroarch:1.22.2@sha256:855fea1198e3474243e31455c1b42c6a18f354ae4cd275e26063bfcf0cfa1089
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: ${APP_PORT}
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/retroarch/config
        target: /config
    container_name: retroarch
    labels:
      runtipi.managed: "true"
    networks:
      - tipi_main_network
networks:
  tipi_main_network:
    external: true
