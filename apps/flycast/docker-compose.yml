services:
  flycast:
    image: linuxserver/flycast:2.7.20261018@sha256:111a34293a74da4d21b81baa4cf95fa8c0ea9e2464aa93cfa61a60bdffdee5ef
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/flycast/config
        target: /config
    container_name: flycast
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
