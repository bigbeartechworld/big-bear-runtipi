services:
  flycast:
    image: linuxserver/flycast:2.7.20261025@sha256:fd4d47dc0f9f448928e27dacfa233376e9cc0feb11c396d2805b556799633596
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/flycast/config
        target: /config
    container_name: flycast
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
