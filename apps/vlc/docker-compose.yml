services:
  vlc:
    image: linuxserver/vlc:3.0.23@sha256:53aec432d32137f182b9f9f18e984961c14a2d541dbb70514bfb7c675d3d69a1
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      VLC_CLI: ''
    volumes:
      - type: bind
        source: /DATA/AppData/vlc/config
        target: /config
    container_name: vlc
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
