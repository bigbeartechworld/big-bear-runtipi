services:
  vlc:
    image: linuxserver/vlc:3.0.24@sha256:102c3ac0ac13a4a8252ab4c1d7b6d7faf52af0f193a54f5f7ddd8c131e798c83
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      VLC_CLI: ''
    volumes:
      - type: bind
        source: /DATA/AppData/vlc/config
        target: /config
    container_name: vlc
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
