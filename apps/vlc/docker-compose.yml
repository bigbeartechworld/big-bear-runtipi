services:
  vlc:
    image: linuxserver/vlc:3.0.24@sha256:cb5a1ca8b2cc2e3b7062a9424cf00d0810d7fa615f64ff7ebcaa1821f2962b17
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      VLC_CLI: ''
    volumes:
      - type: bind
        source: /DATA/AppData/vlc/config
        target: /config
    container_name: vlc
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
