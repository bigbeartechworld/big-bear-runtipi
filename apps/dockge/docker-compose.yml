# Configuration for dockge setup

# Name of the big-bear-dockge application
# Service definitions for the big-bear-dockge application
services:
  dockge:
    # Name of the container
    container_name: dockge
    # Image to be used for the container
    image: louislam/dockge:1.5.0@sha256:335c6368b880ecc203236ed89e6e5232e0d6578e8ef5920e4a502390451502bf
    # Environment variables
    environment:
      # Tell Dockge where is your stacks directory
      DOCKGE_STACKS_DIR: "/DATA/AppData/big-bear-dockge/stacks"
    # Container restart policy
    restart: unless-stopped
    # Volumes to be mounted to the container
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${APP_DATA_DIR}/data:/app/data
      - ${APP_DATA_DIR}/stacks:/DATA/AppData/big-bear-dockge/stacks
    x-runtipi:
      is_main: true
      internal_port: 5001
x-runtipi:
  schema_version: 2
