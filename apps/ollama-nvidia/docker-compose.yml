# Configuration for ollama-nvidia setup

# Name of the big-bear-ollama-nvidia application
# Service definitions for the big-bear-ollama-nvidia application
services:
  ollama-nvidia:
    # Name of the container
    container_name: ollama-nvidia
    # Image to be used for the container
    image: ollama/ollama:0.40.12@sha256:20d1bbfbabe1c97ba4b16301f08a20d8484bcf77047742a3cb71c613d8e12d0b
    # Container restart policy
    restart: unless-stopped
    # Volumes to be mounted to the container
    volumes:
      - ${APP_DATA_DIR}/.ollama:/root/.ollama
    # Define the deployment settings
    deploy:
      # Specify resource reservations
      resources:
        reservations:
          devices:
            # Specify the device driver as NVIDIA
            - driver: nvidia
              # Allocate all available GPUs
              count: all
              capabilities:
                # Define the required capabilities (gpu for GPU resources)
                - gpu
    x-runtipi:
      is_main: true
      internal_port: 11434
x-runtipi:
  schema_version: 2
