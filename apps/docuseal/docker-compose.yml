services:
  docuseal:
    image: docuseal/docuseal:3.3.1@sha256:e171808ce8dabb08491a49a6d8c477670a65ddce5e3de4764904b63a4487940f
    container_name: docuseal
    restart: unless-stopped
    ports:
      - "${APP_PORT}:3000"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    labels:
      runtipi.managed: "true"
    networks:
      - tipi_main_network
networks:
  tipi_main_network:
    external: true
