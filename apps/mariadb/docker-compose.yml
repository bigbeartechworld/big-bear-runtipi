services:
  mariadb:
    image: linuxserver/mariadb:11.8.8@sha256:75ffa39d652653e73848328a667d169a20a1e084fd51a66c4be3eb754a2492c9
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      MYSQL_ROOT_PASSWORD: ''
      MYSQL_DATABASE: ''
      MYSQL_USER: ''
      MYSQL_PASSWORD: ''
      REMOTE_SQL: ''
      CLI_OPTS: ''
    volumes:
      - type: bind
        source: /DATA/AppData/mariadb/config
        target: /config
    container_name: mariadb
    x-runtipi:
      is_main: true
      internal_port: 3306
x-runtipi:
  schema_version: 2
