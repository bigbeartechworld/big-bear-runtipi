services:
  tautulli:
    image: linuxserver/tautulli:2.18.2@sha256:529c7eabcc40554c1dc48f33f1f3cc3b1438462d73e0ec2dac8ac0b66aeeb8d4
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/tautulli/config
        target: /config
    container_name: tautulli
    x-runtipi:
      is_main: true
      internal_port: 8181
x-runtipi:
  schema_version: 2
