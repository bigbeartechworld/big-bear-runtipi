services:
  tautulli:
    image: linuxserver/tautulli:2.18.2@sha256:986125e67ab881504e6a71f93f8fe0932de0e1158f3060b53ca9d12ab38fa3be
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/tautulli/config
        target: /config
    container_name: tautulli
    x-runtipi:
      is_main: true
      internal_port: 8181
x-runtipi:
  schema_version: 2
