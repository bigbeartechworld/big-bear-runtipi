services:
  portainer-tools:
    image: technorabilia/portainer-tools
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      PORTAINER_USERNAME: ''
      PORTAINER_PASSWORD: ''
      PORTAINER_URL: 0.0.0.0:9000
      SERVER_URL: http://0.0.0.0:9999
    ports:
      - target: 9999
        published: ${APP_PORT}
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/portainer-tools/config
        target: /config
    container_name: portainer-tools
    labels:
      runtipi.managed: "true"
    networks:
      - tipi_main_network
networks:
  tipi_main_network:
    external: true
