services:
  portainer-tools:
    image: technorabilia/portainer-tools
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      PORTAINER_USERNAME: ''
      PORTAINER_PASSWORD: ''
      PORTAINER_URL: 0.0.0.0:9000
      SERVER_URL: http://0.0.0.0:9999
    volumes:
      - type: bind
        source: /DATA/AppData/portainer-tools/config
        target: /config
    container_name: portainer-tools
    x-runtipi:
      is_main: true
      internal_port: 9999
x-runtipi:
  schema_version: 2
