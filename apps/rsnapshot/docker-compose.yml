services:
  rsnapshot:
    image: linuxserver/rsnapshot:1.4.5@sha256:5afbec6c331cda21ed0db3e625caa7f23527f28b062f2b6dce3a7750f6d2cf97
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/rsnapshot/config
        target: /config
      - type: bind
        source: /DATA/AppData/rsnapshot/.snapshots
        target: /.snapshots
      - type: bind
        source: /DATA/AppData/rsnapshot/data
        target: /data
    container_name: rsnapshot
    x-runtipi:
      is_main: true
      internal_port: 80
x-runtipi:
  schema_version: 2
