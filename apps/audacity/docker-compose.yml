services:
  audacity:
    image: linuxserver/audacity:4.0.1@sha256:81a3afea2e00cb0aeb0a4a5f8aabb573775afefd1d5db69fc70116e9a1205c0f
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/audacity/config
        target: /config
    container_name: audacity
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
