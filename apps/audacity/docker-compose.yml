services:
  audacity:
    image: linuxserver/audacity:4.0.1@sha256:4e06915fc8add87a34bac9b0c0235d8b9f75a081463972fed25df4a8b58c596e
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/audacity/config
        target: /config
    container_name: audacity
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
