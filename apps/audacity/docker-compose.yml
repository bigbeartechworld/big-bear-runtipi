services:
  audacity:
    image: linuxserver/audacity:4.0.1@sha256:6e0761fff5269228c515e754e6d2bef8be353f939cf2a2eca3d30af7b4a6ee0f
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/audacity/config
        target: /config
    container_name: audacity
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
