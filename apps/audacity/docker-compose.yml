services:
  audacity:
    image: linuxserver/audacity:4.0.1@sha256:95644aca4d27e3b830a09ff45e1b8ed6daa61b1d8e340aef1229368bb5c92cca
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/audacity/config
        target: /config
    container_name: audacity
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
