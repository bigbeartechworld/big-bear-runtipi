services:
  bambustudio:
    image: linuxserver/bambustudio:02.08.04@sha256:857e937fe1c3451244cb178952e0e7a00241ab48c32cb1ce9ea6b27e4fd729e5
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      DARK_MODE: ''
    volumes:
      - type: bind
        source: /DATA/AppData/bambustudio/config
        target: /config
    container_name: bambustudio
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
