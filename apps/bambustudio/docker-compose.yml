services:
  bambustudio:
    image: linuxserver/bambustudio:02.08.04@sha256:056f90dada957824cec32f1a09eaec322a8b1af08e9d117cf5c4dadf89693aeb
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
      DARK_MODE: ''
    volumes:
      - type: bind
        source: /DATA/AppData/bambustudio/config
        target: /config
    container_name: bambustudio
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
