# Configuration for ollama-amd setup

# Name of the big-bear-ollama-amd application
# Service definitions for the big-bear-ollama-amd application
services:
  ollama-amd:
    # Name of the container
    container_name: ollama-amd
    # Image to be used for the container
    image: ollama/ollama:0.40.7-rocm@sha256:65e50ca00b1d05892cc50df3a9ce54e0e718a8915bed029d9a674f390cd26e3d
    # Container restart policy
    restart: unless-stopped
    # Environment variables
    environment:
      - PORT=11434
    # Volumes to be mounted to the container
    volumes:
      - ${APP_DATA_DIR}/.ollama:/root/.ollama
    devices:
      # Attach GPU
      - /dev/kfd
      - /dev/dri
    x-runtipi:
      is_main: true
      internal_port: 11434
x-runtipi:
  schema_version: 2
