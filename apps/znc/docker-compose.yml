services:
  znc:
    image: linuxserver/znc:1.10.3@sha256:51e139085d594ca3b90c415ef081fee2a394387668acb54d32cc9c2852a33823
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/znc/config
        target: /config
    container_name: znc
    x-runtipi:
      is_main: true
      internal_port: 6501
x-runtipi:
  schema_version: 2
