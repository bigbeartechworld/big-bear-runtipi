services:
  znc:
    image: linuxserver/znc:1.10.3@sha256:f5187fab44a3c2cb4ece27030f4857a14d2b06a5ca739bd1d5973f2914dee6bf
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/znc/config
        target: /config
    container_name: znc
    x-runtipi:
      is_main: true
      internal_port: 6501
x-runtipi:
  schema_version: 2
