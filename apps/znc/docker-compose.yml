services:
  znc:
    image: linuxserver/znc:1.10.3@sha256:1ea1c89129a36d0a2a2beeec3bb896ff4b9be5f261e23c623aa8ee9974e1086b
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/znc/config
        target: /config
    container_name: znc
    x-runtipi:
      is_main: true
      internal_port: 6501
x-runtipi:
  schema_version: 2
