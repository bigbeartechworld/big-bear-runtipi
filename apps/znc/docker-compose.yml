services:
  znc:
    image: linuxserver/znc:1.10.3@sha256:ff2c194144b53a2d981ca21eba5158ade449b43c7a23d0f3a6b9de7734cdb2d8
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/znc/config
        target: /config
    container_name: znc
    x-runtipi:
      is_main: true
      internal_port: 6501
x-runtipi:
  schema_version: 2
