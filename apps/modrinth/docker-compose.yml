services:
  modrinth:
    image: linuxserver/modrinth:0.21.9@sha256:091374a836e68847b4ecd7ed5d7875ded4572ba5c5bb3e5311691bc11e95a2dd
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/modrinth/config
        target: /config
    container_name: modrinth
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
