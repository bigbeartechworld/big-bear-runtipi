services:
  modrinth:
    image: linuxserver/modrinth:0.21.10@sha256:5ecb9315ca34544ddfed76f079811bef5f7285d6cf86b7611c1bd31956d66843
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/modrinth/config
        target: /config
    container_name: modrinth
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
