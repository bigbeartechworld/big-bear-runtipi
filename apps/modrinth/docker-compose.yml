services:
  modrinth:
    image: linuxserver/modrinth:0.21.10@sha256:8d9e5b261f3973ded4264610db8c1bf582a66c8bd4994b9086e21793f576615f
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/modrinth/config
        target: /config
    container_name: modrinth
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
