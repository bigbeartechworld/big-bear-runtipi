services:
  modrinth:
    image: linuxserver/modrinth:0.22.0@sha256:6b6e632c4b18b4e72b9f0672c3ff3171de97832fa7b626eeba279ee5205cf295
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/modrinth/config
        target: /config
    container_name: modrinth
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
