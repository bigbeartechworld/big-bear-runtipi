services:
  modrinth:
    image: linuxserver/modrinth:0.22.0@sha256:bcdc1cf7319c190ab75c17b5d02612bb02fadd70b908356202bd58a5da0cdc3a
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/modrinth/config
        target: /config
    container_name: modrinth
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
