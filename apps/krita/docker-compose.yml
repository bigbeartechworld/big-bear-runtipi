services:
  krita:
    image: linuxserver/krita:5.3.4@sha256:3a36ff6d2571856cf893f99add3237ec91920401d6066bc44fed5ecad44eb3b5
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/krita/config
        target: /config
    container_name: krita
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
