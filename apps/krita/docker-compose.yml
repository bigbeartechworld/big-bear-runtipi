services:
  krita:
    image: linuxserver/krita:5.3.4@sha256:cb370716097e8648755c27a48fb5783c59ee9579f48c6dce9b412779593ff95a
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/krita/config
        target: /config
    container_name: krita
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
