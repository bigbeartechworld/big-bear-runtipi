services:
  krita:
    image: linuxserver/krita:5.3.4@sha256:1d88a0cf3f424de6225a1290c251f309ab041c1c6b5bfce3a1581644a3c993fa
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/krita/config
        target: /config
    container_name: krita
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
