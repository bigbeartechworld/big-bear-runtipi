services:
  krita:
    image: linuxserver/krita:5.3.4@sha256:5c185684d783c091e558c197c74df39c1898516afec1eb12620503f841deeb61
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/krita/config
        target: /config
    container_name: krita
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
