services:
  vscodium:
    image: linuxserver/vscodium:1.135.06055@sha256:3a30e9ea4702b685ee6e4e884b9e785442b0db1d2e567c6f271799b1bd83827b
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/vscodium/config
        target: /config
    container_name: vscodium
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
