services:
  vscodium:
    image: linuxserver/vscodium:1.143.17183@sha256:78212cf7c9fffb53177129c37ea1f5173744a01ce5d59fa7a73e1d792913f7e0
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/vscodium/config
        target: /config
    container_name: vscodium
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
