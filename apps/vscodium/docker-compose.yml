services:
  vscodium:
    image: linuxserver/vscodium:1.140.06880@sha256:634727885c3f1e8cb8bdf59fd4de97d263ebf843bede6851ea28e7a9bb2c96be
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/vscodium/config
        target: /config
    container_name: vscodium
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
