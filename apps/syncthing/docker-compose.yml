# Configuration for syncthing setup

# Name of the big-bear-syncthing application
# Service definitions for the big-bear-syncthing application
services:
  syncthing:
    # Name of the container
    container_name: syncthing
    # Image to be used for the container
    image: syncthing/syncthing:2.1@sha256:2b71da7c0d0a91a6ae5285ad079226fecc0a365d08b27720e1f7037b018f7546
    # Container restart policy
    restart: unless-stopped
    # Volumes to be mounted to the container
    volumes:
      - ${APP_DATA_DIR}/data:/var/syncthing
      - ${APP_DATA_DIR}/media/data/syncthing:/media/data/syncthing
    # Ports mapping between host and container
    ports: ["22000:22000/tcp", "22000:22000/udp", "21027:21027/udp"]
    # Environment variables for the container
    environment:
      - PUID=1000 # User ID
      - PGID=1000 # Group ID
    # Stop the container if it exits
    stop_grace_period: 1m
    x-runtipi:
      is_main: true
      internal_port: 8384
x-runtipi:
  schema_version: 2
