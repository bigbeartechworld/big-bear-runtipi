services:
  orcaslicer:
    image: linuxserver/orcaslicer:2.4.2@sha256:b8806fab27725e26ddd14a24f22990bf0780bc7fdadb43e23120b9a1c16c8b88
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/orcaslicer/config
        target: /config
    container_name: orcaslicer
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
