services:
  orcaslicer:
    image: linuxserver/orcaslicer:2.4.2@sha256:636971671567f995a9f77b2b4681ec744a92136f744866a2b0b75cf04d434c30
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: ${APP_PORT}
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/orcaslicer/config
        target: /config
    container_name: orcaslicer
    labels:
      runtipi.managed: "true"
    networks:
      - tipi_main_network
networks:
  tipi_main_network:
    external: true
