services:
  orcaslicer:
    image: linuxserver/orcaslicer:2.4.2@sha256:14f79f464648f80cdbfb392746b1dcc782d5d80ac40ee4557ab87426012568bd
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    ports:
      - target: 3000
        published: ${APP_PORT}
        protocol: tcp
      - target: 3001
        published: 3001
        protocol: tcp
    volumes:
      - type: bind
        source: /DATA/AppData/orcaslicer/config
        target: /config
    container_name: orcaslicer
    labels:
      runtipi.managed: "true"
    networks:
      - tipi_main_network
networks:
  tipi_main_network:
    external: true
