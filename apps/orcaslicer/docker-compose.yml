services:
  orcaslicer:
    image: linuxserver/orcaslicer:2.4.2@sha256:c9300331a3c75bb43c50e423a54283f306d1532fe973641aca0124def0b1e1cf
    restart: unless-stopped
    environment:
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    volumes:
      - type: bind
        source: /DATA/AppData/orcaslicer/config
        target: /config
    container_name: orcaslicer
    x-runtipi:
      is_main: true
      internal_port: 3000
x-runtipi:
  schema_version: 2
